<h2 id="%F0%9F%8E%AF-bu-d%C9%99rsd%C9%99-n%C9%99-%C3%B6yr%C9%99n%C9%99c%C9%99ks%C9%99n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Bu dərsdə nə öyrənəcəksən?</h2>
<ul>
<li><strong>HTTP nədir:</strong> sorğu və cavab, metodlar, başlıqlar, gövdə</li>
<li><strong>Status kodları:</strong> <code>301</code>, <code>401</code>, <code>403</code>, <code>404</code>, <code>429</code>, <code>500</code>, <code>502</code>, <code>503</code>, <code>504</code> və <strong>kimin günahıdır</strong></li>
<li><strong><code>curl</code>:</strong> <code>-v</code>, <code>-I</code>, <code>-L</code>, <code>-H</code>, <code>-X POST -d</code>, <code>-w</code></li>
<li><strong>HTTPS və TLS:</strong> sertifikat, niyə lazımdır, müddətini <code>openssl</code> ilə yoxlamaq</li>
<li><strong>HTTP/1.1 və HTTP/2</strong>, <strong>reverse proxy</strong>, <strong><code>502</code> və <code>504</code> fərqi</strong></li>
<li><strong>Bütöv xəritə:</strong> DNS → TCP → TLS → HTTP</li>
<li><strong>Simptom cədvəli:</strong> <code>refused</code>, <code>timed out</code>, <code>502</code></li>
</ul>
<blockquote>
<p>Sessiya 03-də qatları, Sessiya 04-də TCP handshake və portları öyrəndik. Burada onların <strong>üstündəki</strong> qata baxırıq: proqramların <strong>bir-birinə nə dediyinə</strong>.</p>
</blockquote>

<h2 id="%F0%9F%8D%BD%EF%B8%8F-http-n%C9%99dir-restoran-analogiyas%C4%B1"><img class="emoji" draggable="false" alt="🍽️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f37d.svg" data-marp-twemoji=""/> HTTP nədir? Restoran analogiyası</h2>
<p><strong>HTTP</strong> (HyperText Transfer Protocol) = client ilə server arasında <strong>danışıq qaydası</strong>. Restoranı düşün:</p>
<table>
<thead>
<tr>
<th>Restoranda</th>
<th>HTTP-də</th>
</tr>
</thead>
<tbody>
<tr>
<td>Sən masada <strong>sifariş verirsən</strong></td>
<td>client (brauzer, <code>curl</code>) <strong>sorğu</strong> göndərir</td>
</tr>
<tr>
<td>Ofisiant <strong>mətbəxə</strong> aparır</td>
<td>şəbəkə sorğunu <strong>serverə</strong> çatdırır</td>
</tr>
<tr>
<td>Mətbəx <strong>yeməyi</strong> hazırlayır</td>
<td>server sorğunu <strong>emal edir</strong></td>
</tr>
<tr>
<td>&quot;Hazırdır&quot; və ya &quot;bu yeməyimiz bitib&quot;</td>
<td><strong>cavab</strong> + <strong>status kodu</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>HTTP <strong>həmişə</strong> bu sıra ilə gedir: <strong>əvvəl client soruşur, sonra server cavab verir</strong>. Server özbaşına sənə yazmır. Tək bir sorğu = tək bir cavab.</p>
</blockquote>

<p>HTTP mətn formatındadır. Sorğu 3 hissədən ibarətdir:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>GET /api/health HTTP/1.1          &lt;- 1) ilk sətir: METOD  YOL  VERSİYA
Host: app.example.com             &lt;- 2) başlıqlar (headers): &quot;Ad: dəyər&quot;
User-Agent: curl/8.4.0
Accept: */*
                                  &lt;- boş sətir: &quot;başlıqlar bitdi&quot;
(gövdə, body)                     &lt;- 3) gövdə: GET-də adətən BOŞ olur
</code></pre>
<ul>
<li><strong>Metod:</strong> nə etmək istəyirsən (oxu, yarat, sil)</li>
<li><strong>Yol (path):</strong> serverdə <strong>hansı</strong> resurs (<code>/api/health</code>)</li>
<li><strong>Başlıqlar:</strong> sorğu haqqında <strong>əlavə məlumat</strong> (kimsən, nə formatda istəyirsən)</li>
</ul>
</section>

<table>
<thead>
<tr>

</tr>

<tbody>
<tr>

<td>&quot;menyunu göstər&quot;</td>
<td>yox</td>
</tr>
<tr>
<td><code>POST</code></td>
<td><strong>yarat</strong> / göndər</td>
<td>&quot;yeni sifariş ver&quot;</td>
<td>var</td>
</tr>
<tr>
<td><code>PUT</code></td>

<td>&quot;sifarişi dəyiş&quot;</td>
<td>var</td>
</tr>
<tr>

<h2 id="%F0%9F%9A%A6-status-kodlar%C4%B1-5-qrup"><img class="emoji" draggable="false" alt="🚦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a6.svg" data-marp-twemoji=""/> Status kodları: 5 qrup</h2>
<table>
<thead>
<tr>
<th>Qrup</th>
<th>Mənası</th>
<th>Sadə izah</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>1xx</code></td>
<td>məlumat</td>
<td>&quot;gözlə, davam edirəm&quot; (nadir görürsən)</td>
</tr>
<tr>
<td><code>2xx</code></td>
<td><strong>uğur</strong></td>
<td>&quot;buyur, hazırdır&quot;</td>
</tr>
<tr>
<td><code>3xx</code></td>
<td><strong>yönləndirmə</strong></td>
<td>&quot;yer dəyişib, bura get&quot;</td>
</tr>
<tr>
<td><code>4xx</code></td>
<td><strong>client xətası</strong></td>
<td>&quot;sorğun düzgün deyil&quot;</td>
</tr>
<tr>
<td><code>5xx</code></td>
<td><strong>server xətası</strong></td>
<td>&quot;bizdə nəsə sınıb&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Ən vacib qayda:</strong> <code>4xx</code> = <strong>sorğuya</strong> bax (client günahkardır). <code>5xx</code> = <strong>serverə</strong> bax (server tərəfi günahkardır). Yoxlamağa <strong>hara</strong> baxacağını bu rəqəm deyir.</p>
</blockquote>

<h2 id="%F0%9F%94%8D-%C9%99n-%C3%A7ox-rast-g%C9%99lin%C9%99nl%C9%99r-12-3xx-v%C9%99-4xx"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Ən çox rast gəlinənlər (1/2): <code>3xx</code> və <code>4xx</code></h2>
<table>
<thead>
<tr>
<th>Kod</th>
<th>Adı</th>
<th>Mənası</th>
<th>Kimin günahı?</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>301</code></td>
<td>Moved Permanently</td>
<td>ünvan <strong>həmişəlik</strong> dəyişib (<code>Location</code> başlığına bax)</td>
<td>normaldır, yönləndirmə</td>
</tr>
<tr>
<td><code>401</code></td>
<td>Unauthorized</td>
<td><strong>kimliyin məlum deyil</strong> (token/parol yoxdur və ya səhvdir)</td>
<td><strong>client</strong></td>
</tr>
<tr>
<td><code>403</code></td>
<td>Forbidden</td>
<td>kimsən bilirik, amma <strong>icazən yoxdur</strong></td>
<td><strong>client</strong> (icazə)</td>
</tr>
<tr>
<td><code>404</code></td>
<td>Not Found</td>
<td>bu <strong>yol</strong> serverdə yoxdur</td>
<td><strong>client</strong> (yol səhvi)</td>
</tr>
<tr>
<td><code>429</code></td>
<td>Too Many Requests</td>
<td>çox tez-tez sorğu göndərdin (rate limit)</td>
<td><strong>client</strong> (yavaşla)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>401</code> = &quot;sən kimsən?&quot;, <code>403</code> = &quot;səni tanıyıram, <strong>girmək olmaz</strong>&quot;. Çox qarışdırılır.</p>
</blockquote>
</section>

<h2 id="%F0%9F%94%8D-%C9%99n-%C3%A7ox-rast-g%C9%99lin%C9%99nl%C9%99r-22-5xx"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Ən çox rast gəlinənlər (2/2): <code>5xx</code></h2>
<table>
<thead>
<tr>
<th>Kod</th>
<th>Adı</th>
<th>Mənası</th>
<th>Kimin günahı?</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>500</code></td>
<td>Internal Server Error</td>
<td>tətbiq <strong>özü</strong> xəta verdi (bug, exception)</td>
<td><strong>tətbiq</strong> (loga bax)</td>
</tr>
<tr>
<td><code>502</code></td>
<td>Bad Gateway</td>
<td>proxy backend-dən <strong>pis/boş cavab</strong> aldı, və ya backend-ə qoşula bilmədi</td>
<td><strong>backend</strong></td>
</tr>
<tr>
<td><code>503</code></td>
<td>Service Unavailable</td>
<td>servis <strong>müvəqqəti</strong> cavab verə bilmir (yüklənib, bağlanıb)</td>
<td><strong>server / backend</strong></td>
</tr>
<tr>
<td><code>504</code></td>
<td>Gateway Timeout</td>
<td>proxy backend-i <strong>gözlədi, cavab gəlmədi</strong></td>
<td><strong>backend</strong> (yavaş/donub)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>502</code>, <code>503</code>, <code>504</code> adətən <strong>proxy / load balancer</strong> ilə gəlir. Sən <strong>proxy-ni</strong> görürsən, problem isə <strong>onun arxasındadır</strong>. Fərqi <code>502</code> vs <code>504</code> slaydında görəcəyik.</p>
</blockquote>

<h2 id="%F0%9F%8F%B7%EF%B8%8F-ba%C5%9Fl%C4%B1qlar-headers-%C9%99n-vacib-5-i"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3f7.svg" data-marp-twemoji=""/> Başlıqlar (headers): ən vacib 5-i</h2>
<table>
<thead>
<tr>
<th>Başlıq</th>
<th>Hansı tərəf</th>
<th>Nə deyir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Host</code></td>
<td>sorğu</td>
<td><strong>hansı sayt</strong> istənir (<code>app.example.com</code>). Bir IP-də çox sayt ola bilər</td>
</tr>
<tr>
<td><code>User-Agent</code></td>
<td>sorğu</td>
<td><strong>kimsən</strong> (<code>curl/8.4.0</code>, brauzer adı)</td>
</tr>
<tr>
<td><code>Content-Type</code></td>
<td>hər ikisi</td>
<td>gövdə <strong>hansı formatdadır</strong> (<code>application/json</code>, <code>text/html</code>)</td>
</tr>
<tr>
<td><code>Authorization</code></td>
<td>sorğu</td>
<td><strong>kimlik</strong> (<code>Bearer &lt;token&gt;</code>)</td>
</tr>
<tr>
<td><code>Cache-Control</code></td>
<td>cavab</td>
<td>cavabı <strong>nə qədər</strong> saxlamaq olar (<code>max-age=3600</code>, <code>no-store</code>)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Sessiya 07-dən: DNS adı <strong>IP-yə</strong> çevirir. Amma server <strong>hansı saytı</strong> istədiyini bilmir, <code>Host</code> başlığı bunu deyir. Buna görə <code>curl http://192.168.0.21</code> bəzən <strong>başqa cavab</strong> verir.</p>
</blockquote>
</section>

<h2 id="%F0%9F%94%AC-curl--v-s%C9%99tir-s%C9%99tir-12-sor%C4%9Fu"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52c.svg" data-marp-twemoji=""/> <code>curl -v</code> sətir-sətir (1/2): sorğu</h2>
<p><code>-v</code> (verbose) = <code>curl</code>-ün <strong>nə etdiyini</strong> göstər. Sadəlik üçün əvvəl <code>http://</code> ilə:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -v http://example.com/
* Host example.com:80 was resolved.          &lt;- 1) DNS bitdi (Sessiya 07)
*   Trying 93.184.216.34:80...               &lt;- 2) TCP qoşulma cəhdi
* Connected to example.com (93.184.216.34) port 80   &lt;- TCP handshake OK
&gt; GET / HTTP/1.1                             &lt;- 3) SORĞU (&gt; = göndərilən)
&gt; Host: example.com                          &lt;- başlıq: hansı sayt
&gt; User-Agent: curl/8.4.0                     &lt;- başlıq: kimsən
&gt; Accept: */*                                &lt;- başlıq: hər format olar
&gt;                                            &lt;- boş sətir: sorğu bitdi
</code></pre>
<blockquote>
<p>Çıxış <strong>nümunədir</strong>, <code>curl</code> versiyasına görə sətirlər bir az fərqlənə bilər. Əsas qayda: <code>*</code> = <code>curl</code>-ün öz qeydi, <strong><code>&gt;</code> = sən göndərirsən</strong>, <strong><code>&lt;</code> = server göndərir</strong>.</p>
</blockquote>

<h2 id="%F0%9F%94%AC-curl--v-s%C9%99tir-s%C9%99tir-22-cavab"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52c.svg" data-marp-twemoji=""/> <code>curl -v</code> sətir-sətir (2/2): cavab</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&lt; HTTP/1.1 200 OK                  &lt;- 4) CAVAB (&lt; = gələn). Status: 200 uğur
&lt; Content-Type: text/html          &lt;- gövdə HTML-dir
&lt; Content-Length: 1256             &lt;- gövdə 1256 bayt
&lt; Cache-Control: max-age=604800    &lt;- 7 gün saxlamaq olar
&lt;                                  &lt;- boş sətir: başlıqlar bitdi
&lt;!doctype html&gt;...                 &lt;- 5) gövdə (HTML)
* Connection #0 to host example.com left intact   &lt;- bağlantı bağlanmadı
</code></pre>
<ul>
<li><strong>Tapmaq üçün:</strong> <code>curl -v</code> yazanda əvvəl <code>&gt;</code> sətirlərinə (sən nə göndərdin?), sonra <code>&lt;</code> sətirlərinə (server nə dedi?) bax</li>
<li><strong>Yalnız başlıqlar</strong> lazımdırsa: gövdəni gizlət <code>curl -sv -o /dev/null URL</code></li>
<li>Çox yazırsa: <code>curl -v URL 2&gt;&amp;1 | head -25</code> (<code>-v</code> çıxışı <strong>stderr</strong>-ə gedir)</li>
</ul>

<h2 id="%F0%9F%A7%B0-g%C3%BCnd%C9%99lik-curl--i--l--h"><img class="emoji" draggable="false" alt="🧰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f0.svg" data-marp-twemoji=""/> Gündəlik <code>curl</code>: <code>-I</code>, <code>-L</code>, <code>-H</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -I http://example.com/          # -I: yalnız başlıqlar (HEAD sorğusu)
HTTP/1.1 200 OK
Content-Type: text/html

$ curl -I http://github.com/           # http -&gt; https yönləndirməsi
HTTP/1.1 301 Moved Permanently
Location: https://github.com/          &lt;- &quot;bura get&quot;

$ curl -L http://github.com/           # -L: Location-u izlə (yönləndirməyə get)
$ curl -H &quot;Host: app.example.com&quot; http://192.168.0.21/   # -H: başlıq əlavə et
</code></pre>
<blockquote>
<p>Cavab başlıqları <strong>nümunədir</strong>. <code>-I</code> = &quot;mənə yalnız vizit kartını göstər, məzmunu yox&quot;. <code>-H &quot;Host: ...&quot;</code> ilə <strong>DNS-siz</strong> saytı test edirsən (ingress, load balancer yoxlayanda çox lazımdır).</p>
</blockquote>
</section>

<h2 id="%F0%9F%93%AE-curl--x-post--d-g%C3%B6vd%C9%99-g%C3%B6nd%C9%99rm%C9%99k"><img class="emoji" draggable="false" alt="📮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ee.svg" data-marp-twemoji=""/> <code>curl -X POST -d</code>: gövdə göndərmək</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -X POST http://192.168.0.21:8080/api/users \
       -H &quot;Content-Type: application/json&quot; \
       -d '{&quot;name&quot;:&quot;aygun&quot;}'
{&quot;id&quot;:7,&quot;name&quot;:&quot;aygun&quot;}                     &lt;- server yaratdığı obyekti qaytardı
</code></pre>
<table>
<thead>
<tr>
<th>Hissə</th>
<th>Nə edir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-X POST</code></td>
<td>metodu <code>POST</code> et</td>
</tr>
<tr>
<td><code>-H &quot;Content-Type: application/json&quot;</code></td>
<td>gövdənin <strong>JSON</strong> olduğunu söylə</td>
</tr>
<tr>
<td><code>-d '...'</code></td>
<td><strong>gövdə</strong> (body)</td>
</tr>
<tr>
<td><code>-H &quot;Authorization: Bearer &lt;TOKEN&gt;&quot;</code></td>
<td>lazım olsa kimlik əlavə et</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>-d</code> yazanda <code>curl</code> metodu <strong>özü</strong> <code>POST</code> edir, <code>-X POST</code> çox vaxt artıqdır. <strong>Tokeni</strong> terminal tarixçəsinə və chat-ə yapışdırma.</p>
</blockquote>

<h2 id="%E2%8F%B1%EF%B8%8F-curl--w-haradan-yava%C5%9Fd%C4%B1r"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> <code>curl -w</code>: haradan yavaşdır?</h2>
<p>Sorğunu mərhələlərə bölüb <strong>vaxt</strong> ölçürük (saniyə, <strong>yığılan</strong> cəmdir):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -o /dev/null -s -w &quot;dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} kod=%{http_code}\n&quot; https://example.com
dns=0.012 tcp=0.034 tls=0.071 ttfb=0.120 total=0.125 kod=200
</code></pre>
<table>
<thead>
<tr>
<th>Sahə</th>
<th>Nə vaxta qədər</th>
<th>Böyükdürsə problem hardadır</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>dns</code></td>
<td>ad tapılana</td>
<td><strong>DNS</strong> (Sessiya 07)</td>
</tr>
<tr>
<td><code>tcp</code></td>
<td>TCP qoşuldu</td>
<td><strong>şəbəkə / firewall</strong></td>
</tr>
<tr>
<td><code>tls</code></td>
<td>TLS bitdi</td>
<td><strong>sertifikat / TLS</strong></td>
</tr>
<tr>
<td><code>ttfb</code></td>
<td>ilk bayt gəldi</td>
<td><strong>server / backend yavaşdır</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Hər rəqəm əvvəlkini <strong>də</strong> daxil edir: TCP-nin öz vaxtı = <code>tcp - dns</code>. Nümunədə TLS ≈ <code>0.071 - 0.034</code>.</p>
</blockquote>

<h2 id="%F0%9F%94%90-problem-http-a%C3%A7%C4%B1qd%C4%B1r"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f510.svg" data-marp-twemoji=""/> Problem: HTTP açıqdır</h2>
<p>HTTP mətn kimi gedir. Yolda olan <strong>hər kəs</strong> (Wi-Fi, router, provayder) onu <strong>oxuya və dəyişə</strong> bilər:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  192.168.0.15 ──── router ──── provayder ──── server
       &quot;parol=12345&quot;    [X] hamı oxuya bilir
</code></pre>
<table>
<thead>
<tr>
<th>Təhlükə</th>
<th>Nümunə</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Dinləmə</strong></td>
<td>parol, token açıq görünür</td>
</tr>
<tr>
<td><strong>Dəyişmə</strong></td>
<td>yolda reklam və ya zərərli kod əlavə olunur</td>
</tr>
<tr>
<td><strong>Saxta server</strong></td>
<td>&quot;bank&quot; kimi görünən başqa server</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>HTTPS = HTTP + TLS.</strong> TLS (Transport Layer Security) HTTP-ni <strong>qapalı zərfə</strong> qoyur. Port <code>443</code>-dür (HTTP <code>80</code>). Sessiya 04-dəki portlar.</p>
</blockquote>

<h2 id="%F0%9F%93%9C-sertifikat-serverin-%C5%9F%C9%99xsiyy%C9%99t-v%C9%99siq%C9%99si"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dc.svg" data-marp-twemoji=""/> Sertifikat: serverin &quot;şəxsiyyət vəsiqəsi&quot;</h2>
<p>Brauzer necə bilir ki, <code>example.com</code> <strong>həqiqətən</strong> odur? <strong>Sertifikat</strong> ilə:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>   Kök CA (brauzerdə hazır)  ──imzalayır──►  Aralıq CA  ──imzalayır──►  example.com sertifikatı
   (güvənilən qurum)                                                     &quot;bu açar example.com-undur&quot;
</code></pre>
<ul>
<li><strong>CA</strong> (Certificate Authority, sertifikat verən qurum) = vəsiqəni verən <strong>dövlət idarəsi</strong> kimidir</li>
<li>Sertifikatda var: <strong>kimə</strong> verilib (domen), <strong>kim</strong> verib, <strong>bitmə tarixi</strong>, serverin <strong>açıq açarı</strong></li>
<li>Brauzer yoxlayır: ① imza <strong>güvənilən CA-dandır</strong>, ② <strong>domen uyğundur</strong>, ③ <strong>müddəti bitməyib</strong></li>
<li>Biri pozulsa: <code>SSL certificate problem</code> / brauzerdə qırmızı xəbərdarlıq</li>
</ul>
</section>

<h2 id="%F0%9F%A4%9D-tls-handshake-q%C4%B1sa"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f91d.svg" data-marp-twemoji=""/> TLS handshake: qısa</h2>
<p>TCP handshake-dən <strong>sonra</strong>, HTTP-dən <strong>əvvəl</strong> TLS &quot;tanışlığı&quot; olur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  client                                          server
    │ ── 1. Salam, bu TLS versiyaları var ───────────►│
    │ ◄── 2. Salam, bu mənim sertifikatım ────────────│
    │    (client sertifikatı yoxlayır: CA? domen? müddət?)
    │ ── 3. Birgə gizli açar razılaşdıraq ───────────►│
    │ ◄══ 4. Hazırdır. Bundan sonra HAMISI şifrəli ══►│
</code></pre>
<ul>
<li>TLS 1.3-də bu <strong>bir gediş-gəliş</strong> (round trip) ilə olur, ona görə sürətlidir</li>
<li>Razılaşdırılan açar ilə HTTP <strong>şifrələnir</strong>, kənar adam yalnız <strong>qarışıq bayt</strong> görür</li>
<li>Ona görə <code>curl -w</code>-də <code>tls</code> vaxtı ayrıca görünür</li>
</ul>
</section>

<h2 id="%F0%9F%94%AC-curl--v-https-tls-s%C9%99tirl%C9%99ri"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f52c.svg" data-marp-twemoji=""/> <code>curl -v https://...</code>: TLS sətirləri</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -v https://example.com/ 2&gt;&amp;1 | head -22
* Host example.com:443 was resolved.            &lt;- 1) DNS
*   Trying 93.184.216.34:443...                 &lt;- 2) TCP
* Connected to example.com port 443             &lt;- TCP OK
* TLSv1.3 (OUT), TLS handshake, Client hello    &lt;- 3) TLS: biz salam dedik
* TLSv1.3 (IN), TLS handshake, Server hello     &lt;- server cavab verdi
* Server certificate:                           &lt;- sertifikatı göstərir
*  subject: CN=example.com                      &lt;- kimə verilib
*  expire date: Mar 14 23:59:59 2027 GMT        &lt;- bitmə tarixi
* SSL certificate verify ok.                    &lt;- 4) yoxlama KEÇDİ
&gt; GET / HTTP/2                                  &lt;- 5) indi HTTP (artıq şifrəli)
&lt; HTTP/2 200                                    &lt;- cavab
</code></pre>
<blockquote>
<p>Çıxış <strong>nümunədir</strong>. <code>SSL certificate verify ok</code> yoxdursa və xəta varsa, <strong>problem TLS-dədir</strong>, HTTP-yə hələ çatmayıb.</p>
</blockquote>

<h2 id="%F0%9F%93%85-sertifikat-m%C3%BCdd%C9%99ti-openssl-s_client"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> Sertifikat müddəti: <code>openssl s_client</code></h2>
<p>Sertifikat bitəndə sayt &quot;açılmır&quot;. Müddəti <strong>əmrlə</strong> yoxla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ echo | openssl s_client -connect example.com:443 -servername example.com 2&gt;/dev/null \
    | openssl x509 -noout -subject -issuer -dates
subject=CN = example.com               &lt;- kimə verilib
issuer=C = US, O = DigiCert Inc ...    &lt;- kim verib
notBefore=Jan 13 00:00:00 2026 GMT     &lt;- nə vaxtdan keçərlidir
notAfter=Mar 14 23:59:59 2027 GMT      &lt;- nə vaxta qədər  &lt;-- BUNA BAX
</code></pre>
<ul>
<li><code>-connect host:port</code>: hara qoşulsun; <code>-servername</code>: <code>Host</code> kimi, <strong>hansı sayt</strong> (SNI)</li>
<li><code>echo |</code> bağlantını <strong>dərhal</strong> bağlayır (yoxsa gözləyir)</li>
<li>Qalan günü yoxlamaq: <code>... | openssl x509 -noout -checkend 864000</code> (10 gün)</li>
<li>Bu əmr <strong>monitorinq alertlərinin</strong> əsasıdır: &quot;sertifikat 14 gündən az qalıb&quot;</li>
</ul>
</section>

<td><strong>Format</strong></td>
<td><strong>mətn</strong></td>

<h2 id="%F0%9F%94%80-reverse-proxy-serverin-qar%C5%9F%C4%B1s%C4%B1ndak%C4%B1-qap%C4%B1%C3%A7%C4%B1"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f500.svg" data-marp-twemoji=""/> Reverse proxy: serverin qarşısındakı qapıçı</h2>
<p>Real sistemdə sorğu <strong>birbaşa</strong> tətbiqə getmir. Qarşıda <strong>reverse proxy</strong> durur (<code>nginx</code>, ingress, load balancer, Sessiya 05):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  client ──HTTPS──► [ nginx 192.168.0.10 ] ──HTTP──► [ app 192.168.0.21:8080 ]
                      reverse proxy (qapıçı)          backend (iş görən)
</code></pre>
<table>
<thead>
<tr>
<th>Proxy nə edir</th>
<th>Niyə lazım</th>
</tr>
</thead>
<tbody>
<tr>
<td>TLS-i <strong>özü açır</strong></td>
<td>tətbiq sertifikatla məşğul olmur</td>
</tr>
<tr>
<td>Sorğunu <strong>backend-ə ötürür</strong></td>
<td>bir ünvan, arxada çox servis</td>
</tr>
<tr>
<td>Yükü <strong>bölür</strong></td>
<td>Sessiya 05</td>
</tr>
<tr>
<td>Xəta olsa <strong>özü</strong> <code>502/503/504</code> qaytarır</td>
<td>client <strong>proxy-ni</strong> görür</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Vacib:</strong> <code>curl</code> ilə <code>502</code> alırsansa, proxy <strong>işləyir</strong> (cavab verdi). Problem <strong>onun arxasındadır</strong>.</p>
</blockquote>

<h2 id="%F0%9F%A7%AD-502-vs-504-proxy-backend-%C9%99-n%C9%99-dedi"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> <code>502</code> vs <code>504</code>: proxy backend-ə nə dedi?</h2>
<p>Proxy backend-ə sorğu atdı. İki fərqli şey ola bilər:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  502 Bad Gateway                          504 Gateway Timeout
  proxy ──► backend                        proxy ──► backend
  [X] qoşulma YOX / cavab pis              [OK] qoşuldu, amma...
  (backend ölüdür, port bağlıdır)          ...cavab GƏLMİR (gözləyir, gözləyir)
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th><code>502</code></th>
<th><code>504</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Backend</strong></td>
<td><strong>ölüdür</strong> və ya <strong>pis cavab</strong> verdi</td>
<td><strong>canlıdır</strong>, amma <strong>çox yavaş / donub</strong></td>
</tr>
<tr>
<td><strong>Sürət</strong></td>
<td><strong>tez</strong> gəlir</td>
<td><strong>gec</strong> gəlir (timeout bitəndə)</td>
</tr>
<tr>
<td><strong>Yoxla</strong></td>
<td>backend <strong>işləyirmi</strong>? port, <code>systemctl status</code></td>
<td>backend <strong>niyə yavaşdır</strong>? DB, loqlar</td>
</tr>
<tr>
<td><strong>Analogiya</strong></td>
<td>mətbəx <strong>bağlıdır</strong></td>

<h2 id="%F0%9F%97%BA%EF%B8%8F-brauzerd%C9%99-sayt-a%C3%A7anda-tam-yol"><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5fa.svg" data-marp-twemoji=""/> Brauzerdə sayt açanda tam yol</h2>
<p><code>https://example.com/</code> yazıb Enter basanda (hər addım <strong>ayrıca</strong> sına bilər):</p>
<table>
<thead>
<tr>
<th>№</th>
<th>Addım</th>
<th>Nə baş verir</th>
<th>Sına bilər: simptom</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>DNS</strong></td>
<td><code>example.com</code> -&gt; <code>93.184.216.34</code> (Sessiya 07)</td>
<td><code>Could not resolve host</code></td>
</tr>
<tr>
<td>2</td>
<td><strong>TCP</strong></td>
<td>handshake <code>:443</code>-ə (Sessiya 04)</td>
<td><code>timed out</code> / <code>refused</code></td>
</tr>
<tr>
<td>3</td>
<td><strong>TLS</strong></td>
<td>sertifikat yoxlanır, açar razılaşır</td>
<td><code>SSL certificate problem</code></td>
</tr>
<tr>
<td>4</td>
<td><strong>HTTP sorğu</strong></td>
<td><code>GET / HTTP/2</code> + <code>Host</code></td>
<td><code>4xx</code> (sorğu səhvdir)</td>
</tr>
<tr>
<td>5</td>
<td><strong>Proxy / backend</strong></td>
<td>sorğu arxaya ötürülür</td>
<td><code>502</code> / <code>503</code> / <code>504</code></td>
</tr>
<tr>
<td>6</td>
<td><strong>HTTP cavab</strong></td>
<td><code>200</code> + gövdə</td>
<td><code>5xx</code>, yavaş cavab</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>DNS-in nəticəsi</strong> (IP ünvanı) HTTP sorğusunun <strong>ilk addımıdır</strong>: IP olmadan TCP qoşulmaq olmur. Debug = <strong>hansı addımda dayandığını</strong> tapmaq.</p>
</blockquote>

<h2 id="%F0%9F%9A%A8-simptom-c%C9%99dv%C9%99li-refused-timed-out-502"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a8.svg" data-marp-twemoji=""/> Simptom cədvəli: <code>refused</code>, <code>timed out</code>, <code>502</code></h2>
<table>
<thead>
<tr>
<th>Simptom</th>
<th>Hansı addım</th>
<th>Mənası</th>
<th>İlk yoxla</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Could not resolve host</code></td>
<td>1 DNS</td>
<td>ad IP-yə çevrilmir</td>
<td><code>dig</code>, yazılış səhvi</td>
</tr>
<tr>
<td><code>Connection timed out</code></td>
<td>2 TCP</td>
<td>SYN-ə <strong>cavab yox</strong> (firewall DROP / marşrut)</td>
<td><code>nc -vz</code>, SG/firewall</td>
</tr>
<tr>
<td><code>Connection refused</code></td>
<td>2 TCP</td>
<td><strong>RST</strong> gəldi: port bağlıdır, servis yoxdur</td>
<td><code>ss -tln</code></td>
</tr>
<tr>
<td><code>SSL certificate problem</code></td>
<td>3 TLS</td>
<td>sertifikat bitib / domen səhvdir</td>
<td><code>openssl s_client</code></td>
</tr>
<tr>
<td><code>502 Bad Gateway</code></td>
<td>5 proxy</td>
<td>proxy var, <strong>backend ölüdür</strong></td>
<td>backend <code>systemctl</code>, port</td>
</tr>
<tr>
<td><code>504 Gateway Timeout</code></td>
<td>5 proxy</td>
<td>backend <strong>yavaşdır</strong></td>
<td>backend log, DB</td>
</tr>
<tr>
<td><code>401</code> / <code>403</code> / <code>404</code></td>
<td>4 HTTP</td>
<td><strong>sorğu</strong> (kimlik/icazə/yol)</td>
<td>token, yol, icazə</td>
</tr>
</tbody>
</table>
</section>

<h2 id="%F0%9F%A7%AA-lab-8a-sad%C9%99-server-v%C9%99-curl"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 8a: sadə server və <code>curl</code></h2>
<p>Heç nəyi dəyişməyən təhlükəsiz lab (yalnız <code>localhost</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">mkdir</span> -p /tmp/lab8 &amp;&amp; <span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;salam&quot;</span> &gt; /tmp/lab8/index.html
$ python3 -m http.server 8080 --directory /tmp/lab8 &amp;      <span class="hljs-comment"># server fonda</span>
$ curl -v http://localhost:8080/ 2&gt;&amp;1 | grep -E <span class="hljs-string">&#x27;^[&lt;&gt;]&#x27;</span>    <span class="hljs-comment"># &gt;, &lt; sətirləri</span>
$ curl -s -o /dev/null -w <span class="hljs-string">&quot;%{http_code}\n&quot;</span> http://localhost:8080/yoxdur
$ <span class="hljs-built_in">kill</span> %1                                                   <span class="hljs-comment"># serveri dayandır</span>
$ curl -sv http://localhost:8080/ 2&gt;&amp;1 | grep -i refused
</code></pre>

<tr>

<h2 id="%F0%9F%A7%AA-lab-8b-502-v%C9%99-504-yarat"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 8b: <code>502</code> və <code>504</code> yarat</h2>
<p><code>nginx</code> proxy-ni backend portuna yönəldirik (<code>127.0.0.1:9000</code>). <strong>Config-i dəyişmədən əvvəl</strong> köhnəsini saxla (<code>sudo cp</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-nginx"><span class="hljs-comment"># /etc/nginx/conf.d/lab8.conf</span>
<span class="hljs-section">server</span> { <span class="hljs-attribute">listen</span> <span class="hljs-number">8081</span>;
  <span class="hljs-section">location</span> / { <span class="hljs-attribute">proxy_pass</span> http://127.0.0.1:9000; <span class="hljs-attribute">proxy_read_timeout</span> <span class="hljs-number">5s</span>; } }
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> nginx -t &amp;&amp; <span class="hljs-built_in">sudo</span> nginx -s reload
$ curl -s -o /dev/null -w <span class="hljs-string">&quot;%{http_code}\n&quot;</span> http://localhost:8081/    <span class="hljs-comment"># 9000-də heç kim yox</span>
$ nc -l 9000 &amp;        <span class="hljs-comment"># qoşulmanı QƏBUL edir, cavab VERMİR (bəzi nc-də: nc -l -p 9000)</span>
$ curl -s -o /dev/null -w <span class="hljs-string">&quot;%{http_code} %{time_total}s\n&quot;</span> http://localhost:8081/
</code></pre>
<table>
<thead>
<tr>
<th>Addım</th>
<th>Gözlənilən nəticə</th>
</tr>
</thead>
<tbody>
<tr>
<td>1-ci <code>curl</code></td>
<td><code>502</code> <strong>dərhal</strong> (backend yoxdur)</td>
</tr>
<tr>
<td>2-ci <code>curl</code></td>
<td><code>504</code> təxminən <strong>5 saniyə</strong> sonra (backend qəbul etdi, susdu)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Bitəndə: <code>kill %1</code>, <code>sudo rm /etc/nginx/conf.d/lab8.conf</code>, <code>sudo nginx -s reload</code>.</p>
</blockquote>
</section>

<th>Hadisə</th>
</tr>

<tr>

<td>Monitorinq: <code>https://shop.example.com</code> yavaşdır, bəzən <code>504</code></td>
</tr>
<tr>
<td>14:05</td>
<td>Dev: &quot;server işləyir&quot; (<code>systemctl status</code> aktivdir)</td>
</tr>

<p>Addım-addım gedirik, hər addımda <strong>ən ucuz yoxlamanı</strong> edirik:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ curl -o /dev/null -s -w &quot;dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer}\n&quot; https://shop.example.com
dns=0.01 tcp=0.03 tls=0.07 ttfb=60.01      &lt;- dns/tcp/tls normal, TTFB 60 san.!
</code></pre>
<ul>
<li>DNS, TCP, TLS <strong>sağlamdır</strong>, proxy cavab verir -&gt; problem <strong>arxadadır</strong></li>
<li><code>504</code> (<code>502</code> yox) -&gt; backend <strong>canlıdır</strong>, amma <strong>gecikir</strong></li>
<li>Backend loqunda: <strong>yavaş SQL sorğusu</strong> tapıldı. <strong>Kök səbəb:</strong> DB indeksi yoxdur. <strong>Dərs:</strong> <code>-w</code> vaxtları problemi <strong>addıma</strong> bölür</li>
</ul>

<table>
<thead>
<tr>
<th>Səhv / sual</th>
<th>Niyə belə olur</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;<code>curl http://IP</code> işləmir, amma ad ilə işləyir&quot;</td>
<td>server <code>Host</code> başlığına baxır. <code>-H &quot;Host: ...&quot;</code> əlavə et</td>
</tr>
<tr>
<td><code>502</code>-də <strong>proxy-ni</strong> düzəltməyə çalışmaq</td>
<td>proxy sağlamdır, <strong>backend-ə</strong> bax</td>
</tr>
<tr>
<td><code>401</code> və <code>403</code>-ü qarışdırmaq</td>
<td><code>401</code> = kimlik yoxdur, <code>403</code> = icazə yoxdur</td>
</tr>
<tr>
<td><code>curl -k</code> ilə &quot;həll etmək&quot;</td>
<td>sertifikat yoxlamasını <strong>söndürür</strong>, problemi gizlədir (yalnız test)</td>
</tr>
<tr>
<td><code>http://</code> işləyir, <code>https://</code> işləmir</td>
<td><code>:443</code> açıq deyil və ya sertifikat problemi</td>
</tr>
<tr>
<td>Sertifikat &quot;birdən&quot; bitir</td>
<td>müddət izlənmir. <strong>Alert</strong> qur</td>
</tr>
<tr>
<td>Tokeni <code>curl -H</code> ilə chat-ə yapışdırmaq</td>
<td>tokeni <strong>sızdırırsan</strong>, əvvəl sil</td>
</tr>
</tbody>
</table>
</section>

<h2 id="%F0%9F%93%9D-x%C3%BClas%C9%99"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Xülasə</h2>
<table>
<thead>
<tr>
<th>Mövzu</th>
<th>Yadda saxla</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>HTTP</strong></td>
<td>client soruşur, server cavab verir (sorğu + cavab)</td>
</tr>
<tr>
<td><strong>Sorğu</strong></td>
<td>metod + yol + başlıqlar + gövdə</td>
</tr>
<tr>
<td><strong>Cavab</strong></td>
<td>status kodu + başlıqlar + gövdə</td>
</tr>
<tr>
<td><strong><code>4xx</code> / <code>5xx</code></strong></td>
<td><strong>client</strong> günahı / <strong>server</strong> günahı</td>
</tr>
<tr>
<td><strong><code>401</code> / <code>403</code></strong></td>
<td>kimlik yoxdur / icazə yoxdur</td>
</tr>
<tr>
<td><strong><code>502</code> / <code>504</code></strong></td>
<td>backend <strong>ölüdür</strong> / backend <strong>yavaşdır</strong></td>
</tr>
<tr>
<td><strong>HTTPS</strong></td>
<td>HTTP + TLS, port <code>443</code>, sertifikat ilə</td>
</tr>
<tr>
<td><strong>Sertifikat</strong></td>
<td>CA imzası, domen, <strong>bitmə tarixi</strong></td>
</tr>
<tr>
<td><strong><code>curl -v</code></strong></td>
<td><code>*</code> qeyd, <code>&gt;</code> göndərilən, <code>&lt;</code> gələn</td>
</tr>
<tr>
<td><strong>Tam yol</strong></td>
<td>DNS -&gt; TCP -&gt; TLS -&gt; HTTP -&gt; proxy/backend</td>
</tr>
</tbody>
</table>
<p><strong>Növbəti dərs:</strong> Sessiya 09 — <strong>Linux firewall</strong>: <code>ufw</code>, <code>iptables</code>, <code>nftables</code>.</p>
</section>

<h2 id="%E2%9C%8D%EF%B8%8F-tap%C5%9F%C4%B1r%C4%B1qlar"><img class="emoji" draggable="false" alt="✍️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/270d.svg" data-marp-twemoji=""/> Tapşırıqlar</h2>
<ol>
<li><strong>Analogiya:</strong> HTTP sorğu və cavabını <strong>öz sözlərinlə</strong> izah et. Sorğunun 3 hissəsi hansıdır?</li>
<li><strong>Status kodları:</strong> <code>401</code>, <code>403</code>, <code>404</code> fərqini <strong>hər biri üçün bir real nümunə</strong> ilə yaz.</li>
<li><strong>Kimin günahı:</strong> <code>429</code>, <code>500</code>, <code>502</code>, <code>504</code> hər biri üçün <strong>client yoxsa server</strong>, və <strong>ilk yoxlama</strong> nədir?</li>
<li><strong><code>curl -v</code>:</strong> istənilən <code>https://</code> saytına <code>curl -v</code> et. <strong>DNS, TCP, TLS, HTTP</strong> sətirlərini tap və yaz.</li>
<li><strong>Vaxt:</strong> <code>curl -w</code> ilə <code>dns</code>, <code>tcp</code>, <code>tls</code>, <code>ttfb</code> ölç. <strong>Ən böyük</strong> mərhələ hansıdır?</li>
<li><strong>Sertifikat:</strong> <code>openssl s_client</code> ilə bir saytın <code>notAfter</code> tarixini tap. <strong>Neçə gün</strong> qalıb?</li>
<li><strong>Lab 8b:</strong> <code>502</code> və <code>504</code> yarat. Hər birinin <strong>nə qədər gec</strong> gəldiyini yaz və <strong>niyə</strong> fərqli olduğunu izah et.</li>
<li><strong>Diaqnostika:</strong> Üç ayrı <code>curl</code>: biri <code>Connection refused</code>, biri <code>timed out</code>, biri <code>502</code> verir. Hər biri <strong>hansı addımda</strong> (DNS/TCP/TLS/HTTP/proxy) dayanıb?</li>
</ol>
</section>
