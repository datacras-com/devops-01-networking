<h2 id="%F0%9F%8E%AF-bu-d%C9%99rsd%C9%99-n%C9%99-%C3%B6yr%C9%99n%C9%99c%C9%99ks%C9%99n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Bu dərsdə nə öyrənəcəksən?</h2>
<ul>
<li><strong><code>tcpdump</code> nədir</strong> və niyə &quot;loglar yalan danışa bilər, paket yalan danışmır&quot;</li>
<li><strong>Necə işə salırıq:</strong> <code>sudo</code>, interfeys seçimi (<code>-i</code>), əsas flaglar</li>
<li><strong>Filtrlər (BPF):</strong> milyonlarla paketdən yalnız lazım olanı seçmək</li>
<li><strong>Çıxışı sətir-sətir oxumaq:</strong> vaxt, ünvanlar, <code>Flags</code>, <code>seq</code>, <code>ack</code>, <code>length</code></li>
<li><strong>TCP bayraqları</strong> <code>[S] [S.] [.] [P.] [F.] [R.]</code> paket səviyyəsində</li>
<li><strong>Əsas ssenari:</strong> &quot;SYN gedir, cavab yoxdur&quot; (3 fərqli hal)</li>
<li><strong>DNS və HTTP tutmaq</strong>, <code>.pcap</code> faylı yazmaq və Wireshark-a körpü</li>
<li><strong>Təhlükəsizlik və performans</strong> qaydaları, canlı lab</li>
</ul>
<blockquote>
<p><strong>Sessiya 04</strong>-də handshake, bayraqlar və <code>refused</code>/<code>timeout</code> anlayışını gördük. Bu dərsdə <strong>eyni şeyi birbaşa paketlərin üzərində</strong> görəcəksən.</p>
</blockquote>
</section>

<h2 id="%F0%9F%A7%A9-problem-n%C9%99y%C9%99-inanaq"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Problem: nəyə inanaq?</h2>
<p>Server problemi olanda adətən <strong>loglara</strong> baxırıq. Amma:</p>
<table>
<thead>
<tr>
<th>Mənbə</th>
<th>Nə deyir</th>
<th>Problem</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Tətbiq logu</strong></td>
<td>&quot;Heç bir sorğu gəlmədi&quot;</td>
<td>tətbiq <strong>yalnız özünə çatanı</strong> görür</td>
</tr>
<tr>
<td><strong>Dashboard</strong></td>
<td>&quot;Server sağlamdır&quot;</td>
<td><strong>yoxlamanın</strong> nəyi yoxladığına bağlıdır</td>
</tr>
<tr>
<td><strong>Developer</strong></td>
<td>&quot;Bizdə hər şey işləyir&quot;</td>
<td><strong>öz tərəfini</strong> görür</td>
</tr>
<tr>
<td><strong>Paket</strong></td>
<td>gəldi / gəlmədi / cavab verdi</td>
<td><strong>tək həqiqət</strong>, yalan danışmır</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Tətbiq logu <strong>hekayə danışır</strong>, paket isə <strong>faktı göstərir</strong>. Sorğu serverə <strong>çatmayıbsa</strong>, tətbiq logunda heç nə olmaz, amma şəbəkədə <strong>iz qalır</strong>.</p>
</blockquote>

<h2 id="%F0%9F%93%B9-tcpdump-n%C9%99dir"><img class="emoji" draggable="false" alt="📹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f9.svg" data-marp-twemoji=""/> tcpdump nədir?</h2>
<p><strong>Analogiya:</strong> binanın girişindəki <strong>təhlükəsizlik kamerası</strong>. Kim, nə vaxt, hara gəldi: hamısını <strong>yazır</strong>. Telefon xəttinə qoşulmuş <strong>dinləyici</strong> kimi də düşünə bilərsən.</p>
<table>
<thead>
<tr>
<th>tcpdump</th>
<th>nə edir</th>
<th>nə etmir</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>izləyir</strong></td>
<td>şəbəkə kartından keçən paketləri <strong>göstərir</strong></td>
<td>paketi <strong>dəyişmir</strong></td>
</tr>
<tr>
<td><strong>süzür</strong></td>
<td>filtrə uyğun paketi seçir</td>
<td>problemi <strong>düzəltmir</strong></td>
</tr>
<tr>
<td><strong>yazır</strong></td>
<td><code>.pcap</code> faylına saxlaya bilir</td>
<td><strong>şifrəni açmır</strong> (HTTPS məzmunu görünmür)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>tcpdump</code> <strong>qara qutu</strong> kimidir: nəyin baş verdiyini göstərir, <strong>niyə</strong> baş verdiyini isə <strong>sən</strong> çıxarırsan. Bu dərs məhz <strong>oxumağı</strong> öyrədir.</p>
</blockquote>

<h2 id="%E2%8F%B0-n%C9%99-vaxt-istifad%C9%99-olunur"><img class="emoji" draggable="false" alt="⏰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f0.svg" data-marp-twemoji=""/> Nə vaxt istifadə olunur?</h2>
<table>
<thead>
<tr>
<th>Sual</th>
<th>tcpdump nəyi göstərir</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Sorğu serverə <strong>çatır</strong>?&quot;</td>
<td>paket serverin kartında görünürmü</td>
</tr>
<tr>
<td>&quot;Cavab niyə <strong>gəlmir</strong>?&quot;</td>
<td><code>SYN</code> gedir, <code>SYN-ACK</code> yoxdur</td>
</tr>
<tr>
<td>&quot;5 saniyə <strong>gecikmə</strong> haradadır?&quot;</td>
<td>iki paket arasında vaxt fərqi</td>
</tr>
<tr>
<td>&quot;DNS <strong>yavaşdır</strong>?&quot;</td>
<td>sorğu ilə cavab arasındakı vaxt</td>
</tr>
<tr>
<td>&quot;Bu server <strong>kimlə danışır</strong>?&quot;</td>
<td>hansı IP hansı porta qoşulur</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Qayda: <code>ping</code>, <code>curl</code>, <code>ss</code> <strong>nəticəni</strong> göstərir (işləyir/işləmir). <code>tcpdump</code> isə <strong>səbəbi</strong>: paket <strong>harada və niyə</strong> dayandı.</p>
</blockquote>

<h2 id="%F0%9F%94%91-niy%C9%99-sudo-laz%C4%B1md%C4%B1r"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Niyə <code>sudo</code> lazımdır?</h2>
<p>Adi istifadəçi <strong>yalnız öz proqramının</strong> məlumatını görür. Bütün şəbəkə kartını izləmək isə <strong>başqalarının trafikini də</strong> görmək deməkdir.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Adi istifadəçi:   &quot;öz zəngimi eşidirəm&quot;
  root (sudo):      &quot;xəttdəki bütün zəngləri dinləyə bilərəm&quot;  ← icazə lazımdır
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> apt install -y tcpdump          <span class="hljs-comment"># yoxdursa quraşdır</span>
$ tcpdump -i eth0
tcpdump: eth0: You don<span class="hljs-string">&#x27;t have permission to capture on that device   ← sudo yoxdur
$ sudo tcpdump -i eth0                 # düzgün
</span></code></pre>
<blockquote>
<p>Paket tutmaq <strong>raw (xam) şəbəkə girişi</strong> tələb edir, bunu Linux <strong>yalnız root-a</strong> (və ya xüsusi icazəyə) verir.</p>
</blockquote>

<h2 id="%F0%9F%94%8C-i%CC%87nterfeys-se%C3%A7imi-harada-dinl%C9%99yirik"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> İnterfeys seçimi: harada dinləyirik?</h2>
<p>Kamera <strong>hansı qapıya</strong> baxır? Əvvəl şəbəkə kartlarını (<strong>interface</strong>, interfeys) tap:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ ip -br a
lo       UNKNOWN   127.0.0.1/8
eth0     UP        192.168.0.15/24          &lt;- əsas kart, trafik buradan keçir
docker0  DOWN      172.17.0.1/16            &lt;- Docker körpüsü
$ tcpdump -D                                &lt;- tcpdump-un görə bildiyi interfeyslər
1.eth0 [Up, Running]
2.any (Pseudo-device that captures on all interfaces)
</code></pre>
<table>
<thead>
<tr>
<th>Seçim</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-i eth0</code></td>
<td><strong>yalnız bu kart</strong> (dəqiq, az səs-küy)</td>
</tr>
<tr>
<td><code>-i any</code></td>
<td><strong>bütün kartlar</strong> (hansı kartdan getdiyini bilmirsənsə)</td>
</tr>
<tr>
<td><code>-i lo</code></td>
<td><strong>loopback</strong> (<code>127.0.0.1</code>, eyni maşın daxilində)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>-i</code> yazmasan, tcpdump <strong>özü bir kart seçir</strong>, bu isə səni <strong>yanlış yerə</strong> baxdıra bilər. <code>-i any</code> yazanda sətirlərə <strong><code>eth0 In</code>/<code>eth0 Out</code></strong> (gələn/gedən) sözləri əlavə olunur.</p>
</blockquote>
</section>

<h2 id="%E2%96%B6%EF%B8%8F-i%CC%87lk-%C9%99mr-5-paket-tut"><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/25b6.svg" data-marp-twemoji=""/> İlk əmr: 5 paket tut</h2>
<p><code>-c 5</code> = &quot;5 paketdən sonra <strong>dayan</strong>&quot; (<code>count</code>). Başqa terminalda <code>ping -c 2 192.168.0.1</code> işlət:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -i eth0 -c 5
listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes     &lt;- dinləməyə başladı
14:02:11.201345 IP 192.168.0.15 &gt; gateway: ICMP <span class="hljs-built_in">echo</span> request, <span class="hljs-built_in">id</span> 7, <span class="hljs-built_in">seq</span> 1, length 64
14:02:11.202110 IP gateway &gt; 192.168.0.15: ICMP <span class="hljs-built_in">echo</span> reply, <span class="hljs-built_in">id</span> 7, <span class="hljs-built_in">seq</span> 1, length 64
14:02:12.203001 IP 192.168.0.15 &gt; gateway: ICMP <span class="hljs-built_in">echo</span> request, <span class="hljs-built_in">id</span> 7, <span class="hljs-built_in">seq</span> 2, length 64
14:02:12.203790 IP gateway &gt; 192.168.0.15: ICMP <span class="hljs-built_in">echo</span> reply, <span class="hljs-built_in">id</span> 7, <span class="hljs-built_in">seq</span> 2, length 64
14:02:12.350004 ARP, Request who-has 192.168.0.1 tell 192.168.0.15, length 28    &lt;- Sessiya 02-dəki ARP
5 packets captured                      &lt;- ekrana çıxan
5 packets received by filter            &lt;- filtrə düşən
0 packets dropped by kernel             &lt;- itirilən (0 yaxşıdır)
</code></pre>
<blockquote>
<p>Nümunədir: vaxtlar və <code>id</code> sənin çıxışında fərqli olacaq. Diqqət: <strong><code>gateway</code></strong> sözü gördün, çünki tcpdump <strong>IP-ni adla əvəz etdi</strong>. Bu, növbəti slaydın mövzusudur.</p>
</blockquote>

<h2 id="%F0%9F%94%A2--n-v%C9%99--nn-adlar-yox-r%C9%99q%C9%99ml%C9%99r"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f522.svg" data-marp-twemoji=""/> <code>-n</code> və <code>-nn</code>: adlar yox, rəqəmlər</h2>
<p>Susmaya görə tcpdump IP-ni <strong>ada</strong>, portu <strong>xidmət adına</strong> çevirməyə çalışır (<code>93.184.216.34</code> → <code>example.com</code>, <code>443</code> → <code>https</code>). Bunun <strong>iki problemi</strong> var:</p>
<table>
<thead>
<tr>
<th>Problem</th>
<th>Nəticə</th>
</tr>
</thead>
<tbody>
<tr>
<td>Ad tapmaq üçün tcpdump <strong>özü DNS sorğusu göndərir</strong></td>
<td><strong>trafikə əlavə paket qarışır</strong>, çıxış yavaşlayır</td>
</tr>
<tr>
<td>DNS işləmirsə, <strong>hər sətir gecikir</strong></td>
<td>pis vaxtda <strong>ən çox lazım olanda</strong> donur</td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Nə edir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-n</code></td>
<td><strong>IP-ni</strong> adla əvəz etmə</td>
</tr>
<tr>
<td><code>-nn</code></td>
<td><strong>IP-ni də, portu da</strong> adla əvəz etmə (<code>443</code>, <code>https</code> yox)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Həmişə <code>-nn</code> yaz.</strong> Rəqəm dəqiqdir: <code>443</code> yazılıbsa, nə olduğunu bilirsən. Bu dərsdən sonra əmrlərin hamısı <strong><code>sudo tcpdump -nn</code></strong> ilə başlayacaq.</p>
</blockquote>
</section>

<h2 id="%F0%9F%A7%B0-%C9%99sas-flaglar"><img class="emoji" draggable="false" alt="🧰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f0.svg" data-marp-twemoji=""/> Əsas flaglar</h2>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Nə edir</th>
<th>Nümunə</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-i</code></td>
<td>hansı interfeys</td>
<td><code>-i eth0</code>, <code>-i any</code></td>
</tr>
<tr>
<td><code>-nn</code></td>
<td>ad həll etmə, rəqəm göstər</td>
<td><code>-nn</code></td>
</tr>
<tr>
<td><code>-c N</code></td>
<td>N paketdən sonra dayan</td>
<td><code>-c 20</code></td>
</tr>
<tr>
<td><code>-v</code>, <code>-vv</code></td>
<td><strong>daha ətraflı</strong> (<code>ttl</code>, <code>id</code>, yoxlama cəmi)</td>
<td><code>-vv</code></td>
</tr>
<tr>
<td><code>-S</code></td>
<td><code>seq</code> <strong>mütləq</strong> göstər (susmaya görə nisbi)</td>
<td><code>-S</code></td>
</tr>
<tr>
<td><code>-s N</code></td>
<td>paketin <strong>neçə baytını</strong> götür (<code>snaplen</code>)</td>
<td><code>-s 0</code> = hamısı</td>
</tr>
<tr>
<td><code>-A</code> / <code>-X</code></td>
<td><strong>məzmunu</strong> göstər (ASCII / hex+ASCII)</td>
<td><code>-A</code></td>
</tr>
<tr>
<td><code>-w</code> / <code>-r</code></td>
<td>fayla <strong>yaz</strong> / fayldan <strong>oxu</strong></td>
<td><code>-w a.pcap</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Flaglar <strong>birləşir</strong>: <code>sudo tcpdump -nn -i eth0 -c 10 -vv</code>. Filtr (növbəti slaydlar) <strong>sonda</strong> yazılır.</p>
</blockquote>
</section>

<h2 id="%F0%9F%94%8D--a--x-v%C9%99--s-paketin-i%C3%A7in%C9%99-baxmaq"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> <code>-A</code>, <code>-X</code> və <code>-s</code>: paketin içinə baxmaq</h2>
<p>Susmaya görə tcpdump yalnız <strong>başlığı</strong> (zərfi) göstərir. <strong>Məktubu</strong> (məzmun) görmək üçün:</p>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Nə göstərir</th>
<th>Nə vaxt</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-A</code></td>
<td>məzmunu <strong>ASCII</strong> (mətn) kimi</td>
<td>HTTP, mətn protokolları</td>
</tr>
<tr>
<td><code>-X</code></td>
<td>məzmunu <strong>hex + ASCII</strong> yanbayan</td>
<td>ikili (binary) protokollar</td>
</tr>
<tr>
<td><code>-s 0</code></td>
<td>paketi <strong>tam</strong> götür (kəsmə)</td>
<td>məzmunu tam görmək lazımdırsa</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 -c 1 -X <span class="hljs-string">&#x27;port 80&#x27;</span>
        0x0000:  4500 0082 1c46 4000 4006 b1e6 c0a8 000f  E....F@.@.......   &lt;- sol: hex, sağ: ASCII
        0x0010:  c0a8 0015 c822 0050 a7d3 4f01 0000 0001  .....<span class="hljs-string">&quot;P..O.....
        0x0020:  8018 01f6 8a3c 0000 0101 080a 0000 0000  .....&lt;..........
</span></code></pre>
<blockquote>
<p><code>c0a8 000f</code> = <code>192.168.0.15</code> (hex). Hex-i əl ilə oxumaq <strong>lazım deyil</strong>, əsas məqsəd: <strong><code>-A</code> ilə mətni görmək</strong> (HTTP slaydında).</p>
</blockquote>

<h2 id="%F0%9F%8E%9B%EF%B8%8F-filtr-n%C9%99dir-bpf"><img class="emoji" draggable="false" alt="🎛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f39b.svg" data-marp-twemoji=""/> Filtr nədir? (BPF)</h2>
<p>Real serverdə saniyədə <strong>minlərlə paket</strong> keçir. Hamısını oxumaq <strong>mümkün deyil</strong>. <strong>Filtr</strong> = &quot;yalnız bunu göstər&quot;.</p>
<p><strong>Analogiya:</strong> kamera yazısında <strong>yalnız qırmızı maşını</strong> axtarırsan. Filtrin adı <strong>BPF</strong> (Berkeley Packet Filter): paket <strong>kerneldə süzülür</strong>, ona görə sürətlidir.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 host 192.168.0.21           &lt;- bu IP-yə gələn/ondan gedən
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 port 443                    &lt;- bu port (mənbə VƏ YA təyinat)
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 host 192.168.0.21 and port 443    &lt;- ikisi birlikdə
</code></pre>
<table>
<thead>
<tr>
<th>Filtr</th>
<th>Nə seçir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>host 192.168.0.21</code></td>
<td>mənbə <strong>və ya</strong> təyinat bu IP</td>
</tr>
<tr>
<td><code>port 443</code></td>
<td>mənbə <strong>və ya</strong> təyinat portu <code>443</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Filtr həmişə əmrin sonunda</strong> yazılır, <code>-i</code>, <code>-nn</code>, <code>-c</code> kimi flaglardan <strong>sonra</strong>.</p>
</blockquote>
</section>

<h2 id="%E2%9E%A1%EF%B8%8F-src-dst-v%C9%99-protokol-filtrl%C9%99ri"><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/27a1.svg" data-marp-twemoji=""/> <code>src</code>, <code>dst</code> və protokol filtrləri</h2>
<p><strong>Kimdən?</strong> (<code>src</code>, source) <strong>Kimə?</strong> (<code>dst</code>, destination) <strong>Hansı dildə?</strong> (<code>tcp</code>, <code>udp</code>, <code>icmp</code>)</p>
<table>
<thead>
<tr>
<th>Filtr</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>src 192.168.0.15</code></td>
<td>yalnız <strong>bu cihazdan gedən</strong></td>
</tr>
<tr>
<td><code>dst 192.168.0.21</code></td>
<td>yalnız <strong>bu cihaza gedən</strong></td>
</tr>
<tr>
<td><code>src port 51234</code> / <code>dst port 443</code></td>
<td><strong>mənbə</strong> portu / <strong>təyinat</strong> portu</td>
</tr>
<tr>
<td><code>tcp</code>, <code>udp</code>, <code>icmp</code></td>
<td>yalnız bu <strong>protokol</strong> (<code>icmp</code> = <code>ping</code>)</td>
</tr>
<tr>
<td><code>arp</code></td>
<td>yalnız ARP (Sessiya 02)</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 icmp                          &lt;- yalnız ping
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 src 192.168.0.15 and dst port 443    &lt;- 192.168.0.15-<span class="hljs-keyword">in</span> HTTPS-ə getdiyi
</code></pre>
<blockquote>
<p><code>host</code> iki istiqamətdə işləyir. <strong>Bir istiqaməti</strong> istəyirsənsə, <code>src</code> və ya <code>dst</code> yaz.</p>
</blockquote>

<h2 id="%F0%9F%94%97-and-or-not-v%C9%99-subnet"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> <code>and</code>, <code>or</code>, <code>not</code> və subnet</h2>
<p>Filtrləri <strong>mətn kimi birləşdir</strong>: <code>and</code> (və), <code>or</code> (və ya), <code>not</code> (deyil).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 tcp and port 5432                     &lt;- TCP VƏ port 5432
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 <span class="hljs-string">&#x27;port 80 or port 443&#x27;</span>                 &lt;- HTTP VƏ YA HTTPS
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 not port 22                           &lt;- SSH XARİC hər şey
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 net 192.168.0.0/24                    &lt;- bütün subnet (Sessiya 02-nin /24-ü)
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 <span class="hljs-string">&#x27;host 192.168.0.21 and (port 80 or port 443)&#x27;</span>   &lt;- mötərizə: əvvəl bu
</code></pre>
<table>
<thead>
<tr>
<th>Qayda</th>
<th>Niyə</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>not port 22</code></strong></td>
<td>SSH ilə qoşulubsansa, <strong>öz sessiyanın trafiki ekranı doldurur</strong></td>
</tr>
<tr>
<td><strong>Dırnaq <code>' '</code></strong></td>
<td>mötərizə və <code>or</code> shell-də <strong>xüsusi məna</strong> daşıyır, dırnaqsız xəta verir</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Kiçik filtr yaz, <strong>tədricən genişləndir</strong>: əvvəl <code>host</code>, sonra <code>and port</code>, lazımsa <code>not</code>.</p>
</blockquote>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>14:02:11.201345 IP 192.168.0.15.51234 &gt; 192.168.0.21.80: Flags [S], seq 2810203519, win 64240, length 0

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Flags [S], seq 2810203519, win 64240, length 0
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Flags [S]       &lt;- BAYRAQ: bu paket SYN-dir (&quot;bağlanmaq istəyirəm&quot;), cədvəl növbəti slaydda
seq 2810203519  &lt;- SIRA NÖMRƏSİ: göndərənin &quot;bu paketdən başlayıram&quot; nömrəsi
ack 1001        &lt;- (varsa) TƏSDİQ: &quot;bu nömrəyə qədər aldım, növbətini gözləyirəm&quot;
win 64240       &lt;- PƏNCƏRƏ: göndərənin qəbul buferində neçə bayt yeri var (Sessiya 04, window)
length 0        &lt;- DATA ölçüsü: paketdəki faydalı məlumat (bayt). SYN-də 0, çünki məlumat yoxdur
</code></pre>
<table>
<thead>
<tr>
<th>Sahə</th>
<th>Praktik məna</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>length 0</code></td>
<td><strong>boş idarə paketi</strong> (handshake, ACK)</td>
</tr>
<tr>
<td><code>length 78</code></td>
<td><strong>78 bayt</strong> data (məsələn HTTP sorğusu)</td>
</tr>
<tr>
<td><code>win 0</code></td>
<td>&quot;<strong>yerim yoxdur</strong>, dayan&quot; (yavaşlıq səbəbi ola bilər)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>seq</code> susmaya görə <strong>nisbi</strong> göstərilir: handshake-dən sonra <code>seq 1:79</code> kimi <strong>kiçik</strong> rəqəmlər görəcəksən. Mütləq rəqəmlər üçün <code>-S</code>.</p>
</blockquote>

<h2 id="%F0%9F%9A%A9-tcp-bayraqlar%C4%B1-tcpdump-da-nec%C9%99-yaz%C4%B1l%C4%B1r"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a9.svg" data-marp-twemoji=""/> TCP bayraqları: tcpdump-da necə yazılır</h2>
<p>Sessiya 04-dən SYN, ACK, FIN, RST bayraqlarını xatırla. tcpdump onları <strong>qısa işarə</strong> ilə yazır:</p>
<table>
<thead>
<tr>
<th>tcpdump</th>
<th>Bayraq</th>
<th>Mənası (sadə dillə)</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>[S]</code></td>
<td>SYN</td>
<td>&quot;bağlanmaq istəyirəm&quot;</td>
</tr>
<tr>
<td><code>[S.]</code></td>
<td>SYN-ACK</td>
<td>&quot;hazıram, sən də hazırsan?&quot;</td>
</tr>
<tr>
<td><code>[.]</code></td>
<td>ACK</td>
<td>&quot;aldım&quot; (boş təsdiq)</td>
</tr>
<tr>
<td><code>[P.]</code></td>
<td>PUSH + ACK</td>
<td>&quot;<strong>data</strong> göndərirəm&quot; (sorğu/cavab)</td>
</tr>
<tr>
<td><code>[F.]</code></td>
<td>FIN + ACK</td>
<td>&quot;bağlayıram&quot;</td>
</tr>
<tr>
<td><code>[R]</code> / <code>[R.]</code></td>
<td>RST</td>
<td>&quot;<strong>rədd edirəm</strong> / dərhal kəs&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Nöqtə <code>.</code> = ACK</strong> bayrağıdır. Yəni <code>[S.]</code> = SYN + ACK, <code>[P.]</code> = PUSH + ACK. Gedişatda <strong>demək olar hər paket ACK daşıyır</strong>, ona görə nöqtəni çox görəcəksən.</p>
</blockquote>

<h2 id="%F0%9F%9A%B6-g%C9%99zinti-1-handshake-paketl%C9%99rd%C9%99"><img class="emoji" draggable="false" alt="🚶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6b6.svg" data-marp-twemoji=""/> Gəzinti 1: handshake paketlərdə</h2>
<p><code>curl http://192.168.0.21</code> zamanı <strong>ilk 3 paket</strong> (<code>sudo tcpdump -nn -i eth0 'host 192.168.0.21 and port 80'</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>① 14:02:11.201 IP 192.168.0.15.51234 &gt; 192.168.0.21.80: Flags [S],  seq 2810203519, win 64240, length 0   &lt;- SYN
② 14:02:11.202 IP 192.168.0.21.80 &gt; 192.168.0.15.51234: Flags [S.], seq 1231234567, ack 2810203520, win 65160, length 0   &lt;- SYN-ACK
③ 14:02:11.202 IP 192.168.0.15.51234 &gt; 192.168.0.21.80: Flags [.],  ack 1, win 502, length 0   &lt;- ACK
</code></pre>
<table>
<thead>
<tr>
<th>Addım</th>
<th>Nəyə baxırsan</th>
</tr>
</thead>
<tbody>
<tr>
<td>① <code>[S]</code></td>
<td><strong>mənbə</strong> <code>192.168.0.15.51234</code> <strong>təyinat</strong> <code>.80</code>-ə yazır</td>
</tr>
<tr>
<td>② <code>[S.]</code></td>
<td><strong>istiqamət çevrildi</strong> (<code>.80 &gt; ...51234</code>). <code>ack 2810203520</code> = SYN nömrəsi <strong>+1</strong></td>
</tr>
<tr>
<td>③ <code>[.]</code></td>
<td>yenə client. <code>ack 1</code> (nisbi) = &quot;sənin SYN-ACK-ını aldım&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Nümunədir:</strong> <code>seq</code> və port rəqəmləri sənin çıxışında <strong>fərqli</strong> olacaq. Dəyişməyən: <strong>ardıcıllıq <code>[S]</code> → <code>[S.]</code> → <code>[.]</code></strong> və <code>ack</code> = qarşı tərəfin <code>seq</code>-i <strong>+1</strong>. Vaxt fərqi <code>0.001</code> san = şəbəkə <strong>sürətlidir</strong>.</p>
</blockquote>
</section>

<p>Sessiya 04-də <code>refused</code> = &quot;cihaz cavab verdi: bu portda heç kim yoxdur&quot;. Paketdə:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ curl --connect-timeout 3 http://192.168.0.21:9999

$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 <span class="hljs-string">&#x27;host 192.168.0.21 and port 9999&#x27;</span>
14:05:01.100 IP 192.168.0.15.51300 &gt; 192.168.0.21.9999: Flags [S],  <span class="hljs-built_in">seq</span> 3456789012, win 64240, length 0   &lt;- SYN gedir
14:05:01.101 IP 192.168.0.21.9999 &gt; 192.168.0.15.51300: Flags [R.], <span class="hljs-built_in">seq</span> 0, ack 3456789013, win 0, length 0   &lt;- RST dərhal qayıdır
</code></pre>

<tr>

<th>Mənası</th>
</tr>

<tr>
<td><code>[S]</code> → <strong>dərhal</strong> <code>[R.]</code></td>
<td>cihaz <strong>yaşayır</strong>, amma portda <strong>dinləyən yoxdur</strong></td>
</tr>
<tr>
<td>cavab vaxtı <code>0.001</code> san</td>
<td><strong>tez</strong> xəta: gözləmə yoxdur</td>
</tr>
</tbody>

<blockquote>
<p><strong>Qapı var, ev boşdur</strong>: qapıçı &quot;burada heç kim yaşamır&quot; deyir. Yoxlayacağın yer: <strong>servis işləyir? port düzgündür?</strong> (<code>ss -tlnp</code>, Sessiya 04).</p>

<h2 id="%E2%8F%B3-timeout-paket-s%C9%99viyy%C9%99sind%C9%99-s%C3%BCkut"><img class="emoji" draggable="false" alt="⏳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f3.svg" data-marp-twemoji=""/> <code>timeout</code> paket səviyyəsində: sükut</h2>
<p><code>timeout</code> = <strong>heç bir cavab yoxdur</strong>. Paketdə fərq <strong>dramatikdir</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ curl --connect-timeout 5 http://192.168.0.21:8080
curl: (28) Failed to connect to 192.168.0.21 port 8080: Connection timed out

$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 <span class="hljs-string">&#x27;host 192.168.0.21 and port 8080&#x27;</span>
10:15:00.000 IP 192.168.0.15.51400 &gt; 192.168.0.21.8080: Flags [S], <span class="hljs-built_in">seq</span> 77001, win 64240, length 0   &lt;- 1-ci cəhd
10:15:01.003 IP 192.168.0.15.51400 &gt; 192.168.0.21.8080: Flags [S], <span class="hljs-built_in">seq</span> 77001, win 64240, length 0   &lt;- +1 san: təkrar
10:15:03.007 IP 192.168.0.15.51400 &gt; 192.168.0.21.8080: Flags [S], <span class="hljs-built_in">seq</span> 77001, win 64240, length 0   &lt;- +2 san: təkrar
10:15:07.015 IP 192.168.0.15.51400 &gt; 192.168.0.21.8080: Flags [S], <span class="hljs-built_in">seq</span> 77001, win 64240, length 0   &lt;- +4 san: təkrar
</code></pre>
<blockquote>
<p>Eyni <code>seq 77001</code>, <strong>eyni port</strong>: bu <strong>yeni sorğu deyil, təkrardır</strong> (retransmission). Fasilələr <strong>ikiqat artır</strong>: 1, 2, 4, 8 saniyə. Cavab <strong>heç gəlmir</strong>. Ağıllı qayda: <strong>təkrarlanan <code>[S]</code> = itirilir və ya atılır</strong>.</p>
</blockquote>

<h2 id="%F0%9F%9A%A8-ssenari-syn-gedir-cavab-yoxdur"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a8.svg" data-marp-twemoji=""/> Ssenari: &quot;SYN gedir, cavab yoxdur&quot;</h2>
<p><strong>Vəziyyət:</strong> app <code>192.168.0.15</code> yeni DB serverinə <code>192.168.0.21:5432</code> qoşula bilmir (<code>timed out</code>). DBA deyir: &quot;PostgreSQL işləyir, <code>ss -tlnp</code> 5432-də <code>LISTEN</code> göstərir.&quot;</p>
<p>Əsas sual: <strong>paket harada itir?</strong> Üç mümkün hal var:</p>
<table>
<thead>
<tr>
<th>Hal</th>
<th>Client-də görünən</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1</strong></td>
<td><strong><code>[S]</code> heç görünmür</strong></td>
<td>paket <strong>heç çıxmayıb</strong> (client tərəfi)</td>
</tr>
<tr>
<td><strong>2</strong></td>
<td><code>[S]</code> var, <strong>cavab yox</strong></td>
<td><code>[S]</code> yolda <strong>itir</strong> və ya serverdə <strong>atılır</strong></td>
</tr>
<tr>
<td><strong>3</strong></td>
<td><code>[S]</code> və <code>[S.]</code> var, <strong>ACK yox</strong></td>
<td><strong>cavab yolu</strong> və ya client tərəfi problemli</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>İki tərəfdə eyni anda tut:</strong> client-də və serverdə. Hər tərəf <strong>&quot;mən nə gördüm?&quot;</strong> deyir, fərq <strong>itkinin yerini</strong> göstərir. Növbəti slaydlarda hər hal.</p>
</blockquote>

<h2 id="%F0%9F%94%8E-hal-1-v%C9%99-hal-2-syn-yoxdur--syn-var-cavab-yox"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Hal 1 və Hal 2: SYN yoxdur / SYN var, cavab yox</h2>
<p><strong>Hal 1: client-də <code>[S]</code> yoxdur</strong> (tutmaq: <code>sudo tcpdump -nn -i eth0 host 192.168.0.21</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>(heç nə çıxmır)       &lt;- proqram heç paket göndərmir
</code></pre>
<p>Səbəb: <strong>yanlış IP/ad</strong> (DNS), <strong>yanlış marşrut</strong> (<code>ip r</code>), <strong>local firewall egress qaydası</strong> və ya proqram <strong>başqa IP-yə</strong> qoşulur. Yoxla: <code>ip r get 192.168.0.21</code>, <code>getent hosts ad</code>.</p>
<p><strong>Hal 2: client-də <code>[S]</code> təkrarlanır.</strong> İndi <strong>serverdə</strong> tut: <code>sudo tcpdump -nn -i eth0 port 5432</code></p>
<table>
<thead>
<tr>
<th>Serverdə <code>[S]</code></th>
<th>Nə deməkdir</th>
<th>Haradadır problem</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>yoxdur</strong></td>
<td>paket <strong>serverə çatmır</strong></td>
<td><strong>aradakı</strong> firewall, security group, marşrut</td>
</tr>
<tr>
<td><strong>var</strong>, <code>[S.]</code> <strong>yoxdur</strong></td>
<td>server paketi <strong>alır</strong>, amma cavab vermir</td>
<td><strong>server host firewall</strong> (<code>DROP</code>)</td>
</tr>
<tr>
<td><strong>var</strong>, <code>[R.]</code> qayıdır</td>
<td>server <strong>rədd edir</strong></td>
<td><code>refused</code>: servis/port problemidir</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Əhəmiyyətli: tcpdump <strong>gələn paketi firewall atmazdan əvvəl</strong> görür. Yəni &quot;serverdə <code>[S]</code> görünür amma cavab yoxdur&quot; = paket <strong>kartdadır, sistem onu atır</strong> (host firewall). Gedən paketi isə <strong>local firewall bloklayıbsa</strong>, tcpdump onu <strong>görməyə bilər</strong>.</p>
</blockquote>
</section>

<h2 id="%F0%9F%94%8E-hal-3-syn-ack-var-ack-yoxdur"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> Hal 3: SYN-ACK var, ACK yoxdur</h2>
<p>Client-də <strong><code>[S]</code> və <code>[S.]</code> görünür</strong>, amma <code>[.]</code> yoxdur. Server <code>[S.]</code> göndərməyi <strong>təkrarlayır</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>10:30:00.000 IP 192.168.0.15.51500 &gt; 192.168.0.21.5432: Flags [S],  seq 900, win 64240, length 0     &lt;- SYN
10:30:00.001 IP 192.168.0.21.5432 &gt; 192.168.0.15.51500: Flags [S.], seq 7000, ack 901, length 0      &lt;- SYN-ACK gəldi
10:30:01.002 IP 192.168.0.21.5432 &gt; 192.168.0.15.51500: Flags [S.], seq 7000, ack 901, length 0      &lt;- server təkrarlayır: ACK gəlmir
10:30:03.004 IP 192.168.0.21.5432 &gt; 192.168.0.15.51500: Flags [S.], seq 7000, ack 901, length 0      &lt;- yenə
</code></pre>
<table>
<thead>
<tr>
<th>Kimdə görünür</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Client</strong> <code>[S.]</code> görür, <strong>ACK göndərmir</strong></td>
<td>client <strong>host firewall</strong> gələn cavabı atır (stateful qayda yoxdur)</td>
</tr>
<tr>
<td><strong>Client</strong> ACK göndərir, <strong>serverdə görünmür</strong></td>
<td>ACK <strong>yolda itir</strong>: <strong>asimmetrik marşrut</strong> və ya ara firewall</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Server <strong><code>[S.]</code>-ni təkrarlayır</strong> = &quot;ACK almadım&quot;. Bu hal <strong>nadirdir</strong>, ən çox <strong>asimmetrik marşrut</strong> (gedən və qayıdan yol fərqli) və ya <strong>yarımçıq firewall qaydası</strong> ilə olur. Sessiya 05-dəki <strong>stateful</strong> anlayışını xatırla.</p>
</blockquote>

<h2 id="%F0%9F%A7%AD-3-haldan-n%C9%99tic%C9%99-harada-axtarmal%C4%B1"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 3 haldan nəticə: harada axtarmalı?</h2>
<table>
<thead>
<tr>
<th>Müşahidə</th>
<th>Ehtimal</th>
<th>Növbəti addım</th>
</tr>
</thead>
<tbody>
<tr>
<td>Client-də <strong><code>[S]</code> yox</strong></td>
<td>client tərəfi</td>
<td><code>ip r get</code>, DNS, local qaydalar</td>
</tr>
<tr>
<td><code>[S]</code> var, serverdə <strong>yox</strong></td>
<td><strong>aradakı</strong> firewall / SG / marşrut</td>
<td>SG, NACL, router qaydaları (Sessiya 05)</td>
</tr>
<tr>
<td>Serverdə <code>[S]</code> var, <strong>cavab yox</strong></td>
<td>server <strong>host firewall</strong> DROP</td>
<td><code>iptables</code>/<code>ufw</code> qaydaları</td>
</tr>
<tr>
<td><code>[S]</code> → <strong><code>[R.]</code></strong></td>
<td><strong>servis/port</strong></td>
<td><code>ss -tlnp</code>, portu yoxla</td>
</tr>
<tr>
<td><code>[S]</code>, <code>[S.]</code>, ACK yox</td>
<td><strong>cavab yolu</strong>, asimmetrik</td>
<td>marşrutlar, stateful qayda</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Dərs:</strong> <code>ss -tlnp</code> &quot;servis dinləyir&quot; desə də, <strong>paket serverə çatmaya bilər</strong>. &quot;İşləyir&quot; ilə &quot;əlçatandır&quot; <strong>fərqli şeylərdir</strong>. Paketi <strong>hər iki ucda</strong> gör, itkinin yeri bəlli olar.</p>
</blockquote>
</section>

<h2 id="%F0%9F%8C%90-dns-sor%C4%9Fusunu-tutmaq-port-53"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> DNS sorğusunu tutmaq (<code>port 53</code>)</h2>
<p>DNS adətən <strong>UDP 53</strong> (Sessiya 04). Başqa terminalda <code>dig example.com</code> et:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 port 53
14:10:05.100 IP 192.168.0.15.43210 &gt; 192.168.0.1.53: 4711+ A? example.com. (29)       &lt;- sorğu: <span class="hljs-string">&quot;example.com-un IPv4-ü nədir?&quot;</span>
14:10:05.112 IP 192.168.0.1.53 &gt; 192.168.0.15.43210: 4711 1/0/0 A 93.184.216.34 (45)  &lt;- cavab
</code></pre>
<table>
<thead>
<tr>
<th>Hissə</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>4711</code></td>
<td>sorğu <strong>ID</strong>-si: sorğu və cavab <strong>eyni ID</strong> daşıyır</td>
</tr>
<tr>
<td><code>+</code></td>
<td>&quot;rekursiya istəyirəm&quot; (resolver özü axtarsın)</td>
</tr>
<tr>
<td><code>A?</code></td>
<td><strong>A record</strong> sorğusu (adın IPv4 ünvanı)</td>
</tr>
<tr>
<td><code>1/0/0</code></td>
<td>cavabda <strong>1</strong> cavab, 0 səlahiyyətli, 0 əlavə</td>
</tr>
<tr>
<td><code>(29)</code>, <code>(45)</code></td>
<td>DNS mesajının <strong>bayt</strong> ölçüsü</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Vaxt fərqi</strong> (<code>.100</code> → <code>.112</code> = 12 ms) = <strong>DNS gecikməsi</strong>. Cavab <strong>heç gəlmirsə</strong> (yalnız sorğu sətri var), resolver (soruşan DNS server) <strong>əlçatmazdır</strong>. Çox &quot;yavaş sayt&quot; şikayəti əslində <strong>DNS</strong>-dir.</p>
</blockquote>
</section>

<h2 id="%F0%9F%94%93-http-g%C3%B6r%C3%BCn%C3%BCr-https-g%C3%B6r%C3%BCnm%C3%BCr"><img class="emoji" draggable="false" alt="🔓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f513.svg" data-marp-twemoji=""/> HTTP görünür, HTTPS görünmür</h2>
<p><code>-A</code> paketin məzmununu <strong>mətn</strong> kimi göstərir. <strong>HTTP</strong> (şifrəsiz) tamamilə oxunur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 -A -s 0 <span class="hljs-string">&#x27;tcp port 80 and host 192.168.0.21&#x27;</span>
14:20:05.311 IP 192.168.0.15.51234 &gt; 192.168.0.21.80: Flags [P.], <span class="hljs-built_in">seq</span> 1:79, ack 1, length 78: HTTP: GET /login HTTP/1.1
GET /login HTTP/1.1                       &lt;- sorğu sətri açıq mətn
Host: 192.168.0.21                        &lt;- başlıqlar açıq
User-Agent: curl/8.5.0
Authorization: Basic dXNlcjpwYXNz         &lt;- <span class="hljs-string">&quot;user:pass&quot;</span> (<span class="hljs-built_in">base64</span>, şifrə DEYİL!)
</code></pre>
<table>
<thead>
<tr>
<th>Protokol</th>
<th>Port</th>
<th><code>-A</code> ilə nə görürsən</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>HTTP</strong></td>
<td><code>80</code></td>
<td>sorğu, başlıqlar, <strong>parol/cookie</strong> açıq</td>
</tr>
<tr>
<td><strong>HTTPS</strong></td>
<td><code>443</code></td>
<td><strong>şifrəli zibil</strong> (<code>.....x.\..</code>). Yalnız IP, port, ölçü, vaxt</td>
</tr>
</tbody>
</table>
<blockquote>
<p>HTTPS-də məzmun <strong>görünmür</strong>, amma tcpdump hələ də <strong>handshake, <code>[R.]</code>, gecikmə, paket ölçüsü</strong> göstərir. Yəni <strong>bağlantı problemini</strong> tapırsan, <strong>məzmunu oxumursan</strong>. Bu <strong>yaxşıdır</strong>: şifrələmə məhz bunun üçündür.</p>
</blockquote>

<h2 id="%F0%9F%92%BE-pcap-yazmaq-v%C9%99-oxumaq"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4be.svg" data-marp-twemoji=""/> <code>.pcap</code> yazmaq və oxumaq</h2>
<p>Canlı axın <strong>sürətlə keçir</strong>. Faylı yaz, <strong>sonra sakit oxu</strong> və ya başqasına göndər:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i eth0 -w /tmp/web.pcap -c 500 <span class="hljs-string">&#x27;port 80 or port 443&#x27;</span>    &lt;- YAZ (ekrana çıxmır)
500 packets captured
$ tcpdump -nn -r /tmp/web.pcap | <span class="hljs-built_in">head</span>                                      &lt;- OXU (<span class="hljs-built_in">sudo</span> lazım deyil)
$ tcpdump -nn -r /tmp/web.pcap <span class="hljs-string">&#x27;tcp[tcpflags] &amp; tcp-rst != 0&#x27;</span>              &lt;- yalnız RST paketləri
$ scp user@192.168.0.21:/tmp/web.pcap .                                    &lt;- Wireshark üçün yüklə
</code></pre>
<table>
<thead>
<tr>
<th>Alət</th>
<th>Nə edir</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>tcpdump</strong> <code>-w</code>/<code>-r</code></td>
<td>serverdə <strong>tut</strong>, terminalda <strong>süz</strong></td>
</tr>
<tr>
<td><strong>Wireshark</strong></td>
<td><code>.pcap</code> faylını <strong>qrafik</strong> açır: rəngli paketlər, <strong>&quot;Follow TCP Stream&quot;</strong> (söhbəti bütöv göstərir)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Praktik iş bölgüsü: <strong>serverdə</strong> (GUI yoxdur) <code>tcpdump -w</code>, <strong>öz kompüterində</strong> Wireshark ilə analiz. Wireshark ayrıca alətdir, burada yalnız <strong>körpünü</strong> qururuq.</p>
</blockquote>

<h2 id="%E2%9A%A0%EF%B8%8F-t%C9%99hl%C3%BCk%C9%99sizlik-v%C9%99-performans-qaydalar%C4%B1"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Təhlükəsizlik və performans qaydaları</h2>
<table>
<thead>
<tr>
<th>Qayda</th>
<th>Niyə</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Yalnız öz sistemində / icazə ilə</strong></td>
<td>başqasının trafikini tutmaq <strong>hüquqi və etik pozuntudur</strong></td>
</tr>
<tr>
<td><strong><code>.pcap</code> = həssas fayl</strong></td>
<td>HTTP-də <strong>parol, token, cookie</strong> ola bilər. Paylaşma, işi bitəndə <strong>sil</strong></td>
</tr>
<tr>
<td><strong>AI-yə göndərmə</strong></td>
<td>həssas hissələri <strong>sil</strong>, yalnız <strong>başlıq sətirlərini</strong> ver (<code>-A</code>-sız)</td>
</tr>
<tr>
<td><strong><code>-c</code> və ya vaxt limiti</strong></td>
<td><strong>fayl və disk dolmasın</strong></td>
</tr>
<tr>
<td><strong>Dar filtr</strong> (<code>host</code>, <code>port</code>)</td>
<td>CPU yükü azalır, <strong>az məxfi məlumat</strong> tutulur</td>
</tr>
<tr>
<td><strong><code>-s</code> ilə ölçü</strong></td>
<td>yalnız başlıq lazımdırsa kiçik götür (məs. <code>-s 96</code>), <strong>az disk</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Yüksək yüklü production serverdə <strong>filtrsiz</strong> tutmaq <strong>paket itkisinə</strong> və yük artımına səbəb ola bilər. Əvvəl <strong>dar filtr + <code>-c</code></strong>, sonra genişlət.</p>
</blockquote>
</section>

<h2 id="%F0%9F%A7%AA-lab-10a--handshake-i-canl%C4%B1-g%C3%B6r"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 10a — handshake-i canlı gör</h2>
<p><strong>Məqsəd:</strong> <code>curl</code> zamanı <code>[S]</code> → <code>[S.]</code> → <code>[.]</code> ardıcıllığını tutmaq. <strong>İki terminal</strong> aç.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># TERMINAL 1: dinlə (loopback, lokal server üçün)</span>
$ <span class="hljs-built_in">sudo</span> tcpdump -nn -i lo -c 10 <span class="hljs-string">&#x27;port 8080&#x27;</span>

<span class="hljs-comment"># TERMINAL 2: kiçik server qaldır və sorğu göndər</span>
$ python3 -m http.server 8080 --<span class="hljs-built_in">bind</span> 127.0.0.1 &amp;       &lt;- fonda server
$ curl -s -o /dev/null http://127.0.0.1:8080/
</code></pre>
<table>
<thead>
<tr>
<th>Gözlənilən nəticə</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td>Terminal 1-də <code>Flags [S]</code> → <code>[S.]</code> → <code>[.]</code></td>
<td><strong>handshake</strong> tamamdır</td>
</tr>
<tr>
<td>Sonra <code>[P.]</code> (data), <code>[.]</code> (təsdiq), <code>[F.]</code> (bağlanma)</td>
<td>sorğu, cavab, <strong>bağlanma</strong></td>
</tr>
<tr>
<td><code>127.0.0.1.8080</code> təyinat, <strong>müvəqqəti</strong> mənbə port</td>
<td><strong>client portu</strong> hər dəfə fərqlidir</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Çıxışlar <strong>nümunədir</strong>. İş bitəndə serveri dayandır: <code>kill %1</code>. <strong>Tapşırıq:</strong> hər sətrin <code>seq</code>/<code>ack</code> rəqəmlərini <strong>kağızda</strong> izlə: <code>ack</code> = qarşı tərəfin <code>seq</code>-i + data uzunluğu.</p>
</blockquote>
</section>

<h2 id="%F0%9F%A7%AA-lab-10b--refused-v%C9%99-timeout-yarat"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 10b — <code>refused</code> və <code>timeout</code> yarat</h2>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Diqqət:</strong> <code>iptables</code> qaydası <strong>yalnız <code>lo</code> (loopback)</strong> üzərindədir, SSH-a toxunmur. Yenə də <strong>qaydanı sonda mütləq sil</strong>. Geri qaytarma: <code>sudo iptables -D INPUT -i lo -p tcp --dport 8080 -j DROP</code>.</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># TERMINAL 1:   sudo tcpdump -nn -i lo &#x27;port 8080&#x27;</span>
<span class="hljs-comment"># TERMINAL 2:</span>
$ <span class="hljs-built_in">kill</span> %1                                                 <span class="hljs-comment"># serveri dayandır (Lab 10a-dan)</span>
$ curl --connect-timeout 2 http://127.0.0.1:8080          <span class="hljs-comment"># 1) REFUSED: [S] -&gt; [R.] dərhal</span>
$ python3 -m http.server 8080 --<span class="hljs-built_in">bind</span> 127.0.0.1 &amp;          <span class="hljs-comment"># serveri geri qaldır</span>
$ <span class="hljs-built_in">sudo</span> iptables -I INPUT -i lo -p tcp --dport 8080 -j DROP    <span class="hljs-comment"># firewall: DROP</span>
$ curl --connect-timeout 2 http://127.0.0.1:8080          <span class="hljs-comment"># 2) TIMEOUT: [S] təkrarlanır</span>
$ <span class="hljs-built_in">sudo</span> iptables -D INPUT -i lo -p tcp --dport 8080 -j DROP    <span class="hljs-comment"># QAYDANI SİL</span>
$ curl -s -o /dev/null http://127.0.0.1:8080/             <span class="hljs-comment"># 3) yenə işləyir</span>
</code></pre>
<table>
<thead>
<tr>
<th>Hal</th>
<th><code>curl</code></th>
<th>tcpdump</th>
</tr>
</thead>
<tbody>
<tr>
<td>1) server <strong>yoxdur</strong></td>
<td><code>Connection refused</code></td>
<td><code>[S]</code> → <strong><code>[R.]</code></strong></td>
</tr>
<tr>
<td>2) <strong>DROP</strong> qaydası</td>
<td><code>timed out</code></td>
<td><code>[S]</code> <strong>təkrarlanır</strong> (1, 2, 4 san)</td>
</tr>
<tr>
<td>3) qayda silindi</td>
<td>cavab gəlir</td>
<td>tam handshake</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Üç vəziyyət, <strong>üç fərqli paket nümunəsi</strong>. Bu fərq <strong>real problemdə</strong> səbəbi göstərir. Lab sonunda <code>sudo iptables -S INPUT</code> ilə qaydanın <strong>silindiyini</strong> yoxla.</p>
</blockquote>
</section>

<h2 id="%F0%9F%AA%9C-tipik-s%C9%99hvl%C9%99r"><img class="emoji" draggable="false" alt="🪜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fa9c.svg" data-marp-twemoji=""/> Tipik səhvlər</h2>
<table>
<thead>
<tr>
<th>Səhv</th>
<th>Nəticə</th>
<th>Düzgün</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>sudo</code> yazmamaq</strong></td>
<td><code>permission</code> xətası</td>
<td><code>sudo tcpdump ...</code></td>
</tr>
<tr>
<td><strong><code>-nn</code> yazmamaq</strong></td>
<td>yavaş, DNS paketi qarışır</td>
<td>həmişə <code>-nn</code></td>
</tr>
<tr>
<td><strong>Filtrsiz tutmaq</strong></td>
<td>ekran dolur, vacib sətir itir</td>
<td><code>host</code>/<code>port</code></td>
</tr>
<tr>
<td><strong><code>-i</code> yazmamaq</strong></td>
<td><strong>yanlış kartı</strong> dinləyirsən</td>
<td><code>-i eth0</code> və ya <code>-i any</code></td>
</tr>
<tr>
<td><strong>SSH-da <code>not port 22</code> yazmamaq</strong></td>
<td>öz sessiyanın trafiki ekranı doldurur</td>
<td><code>not port 22</code></td>
</tr>
<tr>
<td><strong>Yalnız bir tərəfdə tutmaq</strong></td>
<td>itkinin yerini bilmirsən</td>
<td><strong>iki ucda</strong> tut</td>
</tr>
<tr>
<td><strong><code>.pcap</code>-ı paylaşmaq</strong></td>
<td>parol/token sızır</td>
<td>həssas fayl kimi saxla</td>
</tr>
</tbody>
</table>
</section>

<h2 id="%F0%9F%93%9D-x%C3%BClas%C9%99"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Xülasə</h2>
<table>
<thead>
<tr>
<th>Mövzu</th>
<th>Yadda saxla</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>tcpdump</strong></td>
<td>şəbəkənin &quot;kamerası&quot;: paketi <strong>göstərir</strong> (<code>sudo</code> lazımdır)</td>
</tr>
<tr>
<td><strong>İnterfeys</strong></td>
<td><code>-i eth0</code>, <code>-i any</code>. Tapmaq: <code>ip -br a</code></td>
</tr>
<tr>
<td><strong>Əsas flaglar</strong></td>
<td><code>-nn</code> (həmişə), <code>-c N</code>, <code>-v</code>, <code>-A</code>, <code>-X</code>, <code>-s</code>, <code>-w</code>, <code>-r</code></td>
</tr>
<tr>
<td><strong>Filtr (BPF)</strong></td>
<td><code>host</code>, <code>port</code>, <code>src</code>, <code>dst</code>, <code>tcp/udp/icmp</code>, <code>and/or/not</code>, <code>net</code></td>
</tr>
<tr>
<td><strong>Sətir</strong></td>
<td>vaxt, <strong>mənbə.port &gt; təyinat.port</strong>, <code>Flags</code>, <code>seq</code>, <code>ack</code>, <code>win</code>, <code>length</code></td>
</tr>
<tr>
<td><strong>Bayraqlar</strong></td>
<td><code>[S]</code> <code>[S.]</code> <code>[.]</code> <code>[P.]</code> <code>[F.]</code> <code>[R.]</code></td>
</tr>
<tr>
<td><strong><code>refused</code></strong></td>
<td><code>[S]</code> → dərhal <code>[R.]</code></td>
</tr>
<tr>
<td><strong><code>timeout</code></strong></td>
<td><code>[S]</code> <strong>təkrarlanır</strong> (1, 2, 4 san), cavab yox</td>
</tr>
<tr>
<td><strong>Qayda</strong></td>
<td><strong>iki ucda</strong> tut, dar filtr, <code>-c</code>, <code>.pcap</code> həssasdır</td>
</tr>
</tbody>
</table>

<ol>
<li><strong>Oxu:</strong> <code>192.168.0.15.51234 &gt; 192.168.0.21.80: Flags [S.], seq 500, ack 101</code> sətrində <strong>mənbə IP, mənbə port, təyinat port</strong> və bayraq nədir?</li>
<li><strong>Filtr:</strong> <code>192.168.0.21</code> ilə <strong>yalnız <code>5432</code> portunda</strong> olan trafiki tutan əmri yaz. SSH-ı <strong>necə xaric edərsən</strong>?</li>
<li><strong>Handshake:</strong> <code>curl</code> zamanı <code>[S]</code>, <code>[S.]</code>, <code>[.]</code> paketlərini tut. <code>ack</code> rəqəmlərinin <strong>niyə +1</strong> olduğunu izah et.</li>
<li><strong>DNS:</strong> <code>port 53</code> ilə <code>dig</code> sorğusunu və cavabını tut. <strong>Sorğu-cavab vaxt fərqini</strong> hesabla.</li>
<li><strong><code>.pcap</code>:</strong> <code>-w</code> ilə yaz, <code>-r</code> ilə oxu, yalnız <strong><code>[R]</code></strong> paketlərini süz.</li>
<li><strong>Lab 10b:</strong> <code>refused</code> və <code>timeout</code> yarat. Hər biri üçün <strong>tcpdump sətrini</strong> yaz və fərqi izah et.</li>
<li><strong>Ssenari:</strong> Client-də <code>[S]</code> <strong>təkrarlanır</strong>, serverdə <code>[S]</code> <strong>görünmür</strong>. Problem <strong>haradadır</strong> və <strong>ilk nəyi yoxlayarsan</strong>?</li>
<li><strong>Təhlükəsizlik:</strong> HTTP və HTTPS-i <code>-A</code> ilə tut. <strong>Hansında parol görünür</strong>, niyə? <code>.pcap</code> faylı ilə <strong>nə etməməlisən</strong>?</li>
</ol>
