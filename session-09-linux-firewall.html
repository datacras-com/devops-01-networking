<h2 id="%F0%9F%8E%AF-bu-d%C9%99rsd%C9%99-n%C9%99-%C3%B6yr%C9%99n%C9%99c%C9%99ks%C9%99n"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> Bu dərsdə nə öyrənəcəksən?</h2>
<ul>
<li><strong>Linux-da firewall harada işləyir:</strong> kernel <code>netfilter</code>, alətlər onun &quot;pultu&quot;dur</li>
<li><strong><code>ufw</code>:</strong> ən asan yol, <code>allow</code>, <code>deny</code>, <code>reject</code>, <code>delete</code></li>
<li><strong><code>iptables</code>:</strong> cədvəl (table), zəncir (chain), qayda, sıra</li>
<li><strong><code>ESTABLISHED,RELATED</code></strong> qaydası niyə vacibdir və <strong>default DROP</strong> necə qurulur</li>
<li><strong><code>nftables</code>:</strong> yeni nəsil və <code>iptables</code> ilə fərqi</li>
<li><strong>Özünü kilidləmə:</strong> SSH-ı kəsmədən firewall dəyişmək</li>
<li><strong>Problem həlli:</strong> port açıqdır, amma çatmır. Haradan baxaq?</li>
</ul>
<blockquote>
<p>Sessiya 05-də firewall-un <strong>nə</strong> olduğunu öyrəndin (stateful, default deny, <code>DROP</code> və <code>REJECT</code>). Bu dərs <strong>Linux-da əlinlə necə yazılır</strong> sualının cavabıdır.</p>
</blockquote>

<h2 id="%F0%9F%A7%A9-problem-qayda-anlay%C4%B1%C5%9F%C4%B1-var-b%C9%99s-linux-da-hara-yaz%C4%B1m"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Problem: qayda anlayışı var, bəs Linux-da hara yazım?</h2>
<p>Sessiya 05-də qaydanın 4 hissəsini bilirik: <strong>mənbə, təyinat, protokol:port, əməl</strong>.</p>
<p>Linux-da bu qaydaları saxlayan və paketə tətbiq edən şey <strong>ayrıca proqram deyil</strong>. O, <strong>kernelin</strong> içindədir.</p>
<table>
<thead>
<tr>
<th>Sual</th>
<th>Cavab</th>
</tr>
</thead>
<tbody>
<tr>
<td>Paketə kim baxır?</td>
<td>kernelin içindəki <strong><code>netfilter</code></strong></td>
</tr>
<tr>
<td>Qaydanı kim yazır?</td>
<td>sənin əmrin: <code>ufw</code>, <code>iptables</code>, <code>nft</code></td>
</tr>
<tr>
<td>Servis lazımdır?</td>
<td><strong>yox</strong>, qayda kernelə yazılan kimi işləyir</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Analogiya:</strong> <code>netfilter</code> binanın <strong>giriş turniketidir</strong>. <code>ufw</code> və <code>iptables</code> isə turniketə <strong>qayda yazan pultlardır</strong>. Turniket bir dənədir, pult müxtəlifdir.</p>
</blockquote>

<table>
<thead>
<tr>
<th>Alət</th>
<th>Nədir</th>
<th>Harada rast gəlinir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>netfilter</code></td>
<td>kernelin firewall mexanizmi</td>
<td><strong>hər Linux-da</strong></td>
</tr>
<tr>
<td><code>ufw</code></td>
<td>sadə pult (qısa əmrlər)</td>
<td>Ubuntu, Debian</td>
</tr>
<tr>
<td><code>iptables</code></td>
<td>klassik pult, detallı</td>
<td>köhnə və çox mühit</td>
</tr>
<tr>
<td><code>nftables</code> (<code>nft</code>)</td>
<td>yeni nəsil pult</td>
<td>yeni distributivlər</td>
</tr>
<tr>
<td><code>firewalld</code></td>
<td>zonalarla pult</td>
<td>RHEL, Rocky, CentOS</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Vacib:</strong> hamısı <strong>eyni</strong> kernel mexanizminə yazır. Müasir Ubuntu-da <code>iptables</code> əmri çox vaxt arxada <code>nftables</code> ilə işləyir. <strong>Bir serverdə iki pultu qarışdırma</strong>: qaydalar bir-birini pozar.</p>
</blockquote>

<h2 id="%F0%9F%9F%A2-ufw-%C9%99n-asan-ba%C5%9Flan%C4%9F%C4%B1c"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e2.svg" data-marp-twemoji=""/> ufw: ən asan başlanğıc</h2>
<p><code>ufw</code> (Uncomplicated Firewall) = &quot;mürəkkəb olmayan firewall&quot;. Əvvəl <strong>vəziyyətə</strong> baxaq:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw status verbose
Status: inactive
</code></pre>
<ul>
<li><code>inactive</code> = firewall <strong>söndürülüb</strong>, bütün trafik keçir</li>
<li>Qayda yazmaq olar, amma <code>enable</code> deyənə qədər <strong>işləmir</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw <span class="hljs-built_in">enable</span>
Command may disrupt existing ssh connections. Proceed with operation (y|n)? y
Firewall is active and enabled on system startup
</code></pre>
<blockquote>
<p><strong>Xəbərdarlıq:</strong> SSH ilə işləyirsənsə, <code>enable</code>-dən <strong>əvvəl</strong> <code>sudo ufw allow 22/tcp</code> yaz. Əks halda <strong>özünü bağlaya</strong> bilərsən (aşağıda ayrıca slayd var).</p>
</blockquote>

<h2 id="%F0%9F%93%9C-ufw-default-siyas%C9%99t"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4dc.svg" data-marp-twemoji=""/> ufw: default siyasət</h2>
<p><code>ufw</code> qayda yazmazdan əvvəl <strong>iki ümumi qərar</strong> verir: gələn və çıxan trafik üçün.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw default deny incoming     <span class="hljs-comment"># kənardan gələn: hamısı bağlı</span>
$ <span class="hljs-built_in">sudo</span> ufw default allow outgoing    <span class="hljs-comment"># içəridən çıxan: hamısı açıq</span>
</code></pre>
<table>
<thead>
<tr>
<th>Qərar</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>deny incoming</code></td>
<td>icazə verilməyən <strong>gələn</strong> hər şey bağlıdır (<strong>default deny</strong>, Sessiya 05)</td>
</tr>
<tr>
<td><code>allow outgoing</code></td>
<td>server internetə, DNS-ə, <code>apt</code>-a <strong>çıxa bilir</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Bu iki sətir ən yaxşı başlanğıcdır: <strong>gələni bağla, çıxanı burax</strong>, sonra yalnız lazım olanı <strong>aç</strong>.</p>
</blockquote>

<h2 id="%E2%9C%85-ufw-allow-deny-reject"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> ufw: allow, deny, reject</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw allow 22/tcp       <span class="hljs-comment"># 22/tcp-ə hamıdan icazə</span>
$ <span class="hljs-built_in">sudo</span> ufw allow 443/tcp      <span class="hljs-comment"># HTTPS</span>
$ <span class="hljs-built_in">sudo</span> ufw deny 5432/tcp      <span class="hljs-comment"># DROP: səssiz at  (client: timeout)</span>
$ <span class="hljs-built_in">sudo</span> ufw reject 9000/tcp    <span class="hljs-comment"># REJECT: &quot;yox&quot; de (client: refused)</span>
</code></pre>
<table>
<thead>
<tr>
<th>Əmr</th>
<th>Client nə görür</th>
<th>Sessiya 05</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>allow</code></td>
<td>bağlantı <strong>açılır</strong></td>
<td>ACCEPT</td>
</tr>
<tr>
<td><code>deny</code></td>
<td><strong>timeout</strong> (cavab yoxdur)</td>
<td>DROP</td>
</tr>
<tr>
<td><code>reject</code></td>
<td><strong>refused</strong> (dərhal rədd)</td>
<td>REJECT</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>22/tcp</code> yazanda <strong>yalnız TCP</strong> açılır. Yalnız <code>22</code> yazsan, <strong>həm TCP, həm UDP</strong> açılar (Sessiya 04). Lazım olmayanı açma.</p>
</blockquote>

<h2 id="%F0%9F%8E%AF-ufw-yaln%C4%B1z-m%C3%BC%C9%99yy%C9%99n-%C5%9F%C9%99b%C9%99k%C9%99d%C9%99n-icaz%C9%99"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> ufw: yalnız müəyyən şəbəkədən icazə</h2>
<p>&quot;SSH yalnız ofis şəbəkəsindən&quot; (<code>192.168.0.0/24</code>) qaydası:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw allow from 192.168.0.0/24 to any port 22 proto tcp
Rule added
</code></pre>
<p>Oxu: <strong><code>192.168.0.0/24</code>-dən → bu serverin istənilən (<code>any</code>) ünvanına → port 22, tcp</strong>.</p>
<table>
<thead>
<tr>
<th>Hissə</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>from 192.168.0.0/24</code></td>
<td><strong>mənbə</strong> (Sessiya 02: CIDR)</td>
</tr>
<tr>
<td><code>to any</code></td>
<td><strong>təyinat</strong>: bu serverin hər ünvanı</td>
</tr>
<tr>
<td><code>port 22 proto tcp</code></td>
<td><strong>protokol:port</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Sessiya 05-dəki 4 hissəli qayda burada <strong>sözlə</strong> yazılıb. Yalnız tək IP üçün: <code>from 192.168.0.15</code>.</p>
</blockquote>

<h2 id="%F0%9F%94%A2-ufw-n%C3%B6mr%C9%99l%C9%99-%C9%99lav%C9%99-et-sil"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f522.svg" data-marp-twemoji=""/> ufw: nömrələ, əlavə et, sil</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw status numbered
     To                         Action      From
[ 1] 22/tcp                     ALLOW IN    192.168.0.0/24
[ 2] 443/tcp                    ALLOW IN    Anywhere
[ 3] 5432/tcp                   DENY IN     Anywhere

$ <span class="hljs-built_in">sudo</span> ufw delete 3                        <span class="hljs-comment"># nömrə ilə sil</span>
$ <span class="hljs-built_in">sudo</span> ufw delete allow 443/tcp            <span class="hljs-comment"># qaydanın özü ilə sil</span>
$ <span class="hljs-built_in">sudo</span> ufw insert 1 deny from 192.168.0.99 <span class="hljs-comment"># 1-ci yerə əlavə et</span>
</code></pre>
<blockquote>
<p>Qaydalar <strong>yuxarıdan aşağı</strong> yoxlanır, <strong>ilk uyğun gələn qalib gəlir</strong> (Sessiya 05). Ona görə <strong><code>deny</code></strong> qaydası <code>allow</code>-dan <strong>yuxarıda</strong> olmalıdır, yoxsa heç vaxt işləməz. <code>delete</code>-dən sonra <strong>nömrələr dəyişir</strong>, əvvəl yenidən <code>numbered</code> bax.</p>
</blockquote>

<h2 id="%F0%9F%9B%A1%EF%B8%8F-ufw-faydal%C4%B1-%C9%99lav%C9%99l%C9%99r"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> ufw: faydalı əlavələr</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw <span class="hljs-built_in">limit</span> 22/tcp        <span class="hljs-comment"># 30 saniyədə 6+ cəhd edəni müvəqqəti blokla</span>
$ <span class="hljs-built_in">sudo</span> ufw <span class="hljs-built_in">disable</span>             <span class="hljs-comment"># firewall-u söndür (qaydalar qalır)</span>
$ <span class="hljs-built_in">sudo</span> ufw reset               <span class="hljs-comment"># HAMISINI sil və söndür</span>
$ <span class="hljs-built_in">sudo</span> ufw logging on          <span class="hljs-comment"># bloklananları log-a yaz</span>
</code></pre>
<table>
<thead>
<tr>
<th>Əmr</th>
<th>Nə vaxt</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>limit</code></td>
<td>SSH-a <strong>parol sındırma</strong> cəhdlərinə qarşı</td>
</tr>
<tr>
<td><code>disable</code></td>
<td>test zamanı &quot;firewall problemdir?&quot; yoxlaması</td>
</tr>
<tr>
<td><code>reset</code></td>
<td>sıfırdan başlamaq (<strong>diqqət</strong>: SSH qaydası da silinir)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>ufw</code> rahatdır, amma <strong>sadə</strong> ssenarilər üçündür. NAT, <code>FORWARD</code>, ətraflı idarəetmə üçün <strong><code>iptables</code></strong> və ya <strong><code>nftables</code></strong> lazımdır. İndi arxa tərəfə baxaq.</p>
</blockquote>
</section>

<h2 id="%F0%9F%A7%AD-iptables-paketin-yolu"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> iptables: paketin yolu</h2>
<p>Paket Linux-a gələndə <strong>yoldakı məntəqələrdən</strong> keçir. Hər məntəqənin adı <strong>chain</strong> (zəncir) dir:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  A) Mənə gələn:
     gələn ──► PREROUTING ──► marşrut qərarı ──► INPUT ──► yerli proqram
               (nat: DNAT)    &quot;mənə aiddir?&quot;               (sshd, nginx)

  B) Məndən keçən (router/VPN/Docker):
     gələn ──► PREROUTING ──► marşrut qərarı ──► FORWARD ──► POSTROUTING ──► çıxış

  C) Məndən çıxan:
     yerli proqram ──► OUTPUT ──► POSTROUTING ──► çıxış   (nat: SNAT/masquerade)
</code></pre>
<blockquote>
<p><strong>Analogiya:</strong> hava limanı. Paket <strong>PREROUTING</strong>-də qeydiyyatdan keçir, sonra <strong>marşrut qərarı</strong>: bu <strong>mənim</strong> paketimdir (<code>INPUT</code>), yoxsa <strong>tranzitdir</strong> (<code>FORWARD</code>)?</p>
</blockquote>

<h2 id="%F0%9F%93%A6-c%C9%99dv%C9%99ll%C9%99r-v%C9%99-z%C9%99ncirl%C9%99r"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Cədvəllər və zəncirlər</h2>
<p><code>iptables</code>-da <strong>iki əsas cədvəl</strong> (table) var. Cədvəl = qaydaların <strong>qrupu</strong>:</p>
<table>
<thead>
<tr>
<th>Cədvəl</th>
<th>Nə üçün</th>
<th>Zəncirləri</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>filter</code> (default)</td>
<td><strong>burax / at</strong> qərarı</td>
<td><code>INPUT</code>, <code>OUTPUT</code>, <code>FORWARD</code></td>
</tr>
<tr>
<td><code>nat</code></td>
<td><strong>ünvanı dəyiş</strong> (Sessiya 05)</td>
<td><code>PREROUTING</code>, <code>POSTROUTING</code>, <code>OUTPUT</code></td>
</tr>
</tbody>
</table>
<table>
<thead>
<tr>
<th>Zəncir</th>
<th>Hansı paketə baxır</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>INPUT</code></td>
<td><strong>bu serverə</strong> gələn</td>
</tr>
<tr>
<td><code>OUTPUT</code></td>
<td><strong>bu serverdən</strong> çıxan</td>
</tr>
<tr>
<td><code>FORWARD</code></td>
<td>serverdən <strong>keçib</strong> başqasına gedən (router/VPN/Docker)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Adi veb server üçün demək olar ki, <strong>yalnız <code>filter</code> cədvəli, <code>INPUT</code> zənciri</strong> lazımdır. <code>FORWARD</code> və <code>nat</code> server <strong>router kimi</strong> işləyəndə (VPN, Docker) önəmli olur.</p>
</blockquote>

<h2 id="%F0%9F%A7%B1-iptables-bir-qaydan%C4%B1n-qurulu%C5%9Fu"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f1.svg" data-marp-twemoji=""/> iptables: bir qaydanın quruluşu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp -s 192.168.0.0/24 --dport 22 -j ACCEPT
</code></pre>
<table>
<thead>
<tr>
<th>Hissə</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-A INPUT</code></td>
<td><strong>A</strong>ppend: <code>INPUT</code> zəncirinin <strong>sonuna</strong> əlavə et</td>
</tr>
<tr>
<td><code>-p tcp</code></td>
<td>protokol: TCP</td>
</tr>
<tr>
<td><code>-s 192.168.0.0/24</code></td>
<td><strong>s</strong>ource: mənbə</td>
</tr>
<tr>
<td><code>--dport 22</code></td>
<td><strong>d</strong>estination <strong>port</strong>: təyinat portu</td>
</tr>
<tr>
<td><code>-j ACCEPT</code></td>
<td><strong>j</strong>ump: nə et (<code>ACCEPT</code>, <code>DROP</code>, <code>REJECT</code>)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Cümlə kimi oxu: &quot;<strong>INPUT</strong>-a gələn, <strong>tcp</strong>, mənbəyi <strong><code>192.168.0.0/24</code></strong>, portu <strong>22</strong> olan paketi <strong>burax</strong>&quot;. Əmr çıxış vermir: <strong>səssiz</strong> işləyir. Yoxlamaq üçün <code>-L</code> lazımdır.</p>
</blockquote>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> iptables -L INPUT -n -v --line-numbers
Chain INPUT (policy ACCEPT 0 packets, 0 bytes)              <span class="hljs-comment"># &lt;- default policy</span>
num  pkts bytes target  prot opt <span class="hljs-keyword">in</span>  out  <span class="hljs-built_in">source</span>           destination

<tr>

<td>neçə paket <strong>bu qaydaya uyğun gəldi</strong></td>
</tr>

</tr>
<tr>

<h2 id="%F0%9F%94%80--a-v%C9%99--i-s%C4%B1ra-niy%C9%99-vacibdir"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f500.svg" data-marp-twemoji=""/> -A və -I: sıra niyə vacibdir?</h2>
<p><code>-A</code> qaydanı <strong>sona</strong> əlavə edir. <code>-I</code> <strong>istədiyin yerə</strong> (default: başa) qoyur.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp --dport 22 -j DROP        <span class="hljs-comment"># 1-ci qayda (səhv)</span>
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp -s 192.168.0.15 --dport 22 -j ACCEPT   <span class="hljs-comment"># 2-ci</span>

<span class="hljs-comment"># 192.168.0.15 SSH ilə girə BİLMƏZ: 1-ci qayda ilk uyğun gəlir (DROP)</span>
$ <span class="hljs-built_in">sudo</span> iptables -I INPUT 1 -p tcp -s 192.168.0.15 --dport 22 -j ACCEPT
<span class="hljs-comment"># -I ... 1  : ACCEPT qaydasını 1-ci yerə qoyur, indi işləyir</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Sıra:   1. ACCEPT 192.168.0.15 -&gt; 22     2. DROP hamı -&gt; 22
          ilk uyğun gələn qalib: .15 buraxılır, qalanları atılır
</code></pre>
<blockquote>
<p><strong>Qayda:</strong> <strong>daha dar/istisna</strong> qayda <strong>yuxarıda</strong>, <strong>geniş</strong> qayda <strong>aşağıda</strong>. Bu, <code>ufw</code>-dakı eyni məntiqdir.</p>
</blockquote>

<h2 id="%F0%9F%A4%9D-establishedrelated-niy%C9%99-bu-qayda-%C5%9F%C9%99rtdir"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f91d.svg" data-marp-twemoji=""/> ESTABLISHED,RELATED: niyə bu qayda şərtdir?</h2>
<p><strong>Problem.</strong> Sən serverə SSH ilə girmisən. Server <strong>cavab paketləri</strong> göndərir. <code>INPUT</code> zəncirini <strong>hər şeyi atacaq</strong> şəkildə qursan, cavab trafiki də <strong>atılar</strong>.</p>
<p><strong>Həll.</strong> Stateful firewall (Sessiya 05) bağlantını <strong>xatırlayır</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">sudo</span> iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
</code></pre>
<table>
<thead>
<tr>
<th>Hal</th>
<th>Mənası</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>NEW</code></td>
<td>bağlantının <strong>ilk</strong> paketi</td>
</tr>
<tr>
<td><code>ESTABLISHED</code></td>
<td>artıq <strong>açılmış</strong> bağlantının paketi</td>
</tr>
<tr>
<td><code>RELATED</code></td>
<td>açıq bağlantı ilə <strong>əlaqəli</strong> (məs. ICMP xətası)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Bu qayda olmasa, <strong>mövcud SSH sessiyan dondurulur</strong>. Ona görə hər <code>INPUT</code> siyasətinin <strong>ilk qaydası</strong> budur.</p>
</blockquote>
</section>

<h2 id="%F0%9F%9A%A7-default-policy-drop-d%C3%BCzg%C3%BCn-s%C4%B1ra"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a7.svg" data-marp-twemoji=""/> Default policy DROP: düzgün sıra</h2>
<p><strong>Default policy</strong> = heç bir qayda uyğun gəlməyəndə nə olsun. Sessiya 05-dəki <strong>default deny</strong> budur.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1) ƏVVƏL icazələr</span>
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -i lo -j ACCEPT                  <span class="hljs-comment"># lo = özü ilə danışıq</span>
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp -s 192.168.0.0/24 --dport 22 -j ACCEPT
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp --dport 443 -j ACCEPT
<span class="hljs-comment"># 2) ƏN SONDA default policy</span>

<h2 id="%F0%9F%97%91%EF%B8%8F-iptables-qaydan%C4%B1-silm%C9%99k"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5d1.svg" data-marp-twemoji=""/> iptables: qaydanı silmək</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> iptables -L INPUT -n --line-numbers      <span class="hljs-comment"># 1) nömrəyə bax</span>
$ <span class="hljs-built_in">sudo</span> iptables -D INPUT 2                      <span class="hljs-comment"># 2) nömrə ilə sil</span>
$ <span class="hljs-built_in">sudo</span> iptables -D INPUT -p tcp --dport 443 -j ACCEPT   <span class="hljs-comment"># və ya qaydanın özü ilə</span>
$ <span class="hljs-built_in">sudo</span> iptables -S INPUT                        <span class="hljs-comment"># əmr formatında göstər</span>
-P INPUT DROP
-A INPUT -i lo -j ACCEPT
</code></pre>
<table>
<thead>
<tr>
<th>Əmr</th>
<th>Nə edir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-D INPUT 2</code></td>
<td>2-ci qaydanı sil (sonra nömrələr <strong>sürüşür</strong>)</td>
</tr>
<tr>
<td><code>-D INPUT &lt;qayda&gt;</code></td>
<td><code>-A</code> ilə yazdığın qaydanı <strong>eynilə</strong> təkrarla, <code>-A</code> əvəzinə <code>-D</code></td>
</tr>
<tr>
<td><code>-S</code></td>
<td>qaydaları əmr kimi göstər (kopyalamaq üçün yaxşı)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>-F</code> (flush) bütün qaydaları silir. <strong>SSH-da və policy <code>DROP</code>-da heç vaxt işlətmə</strong> (əvvəlcə <code>-P INPUT ACCEPT</code>).</p>
</blockquote>

<h2 id="%F0%9F%94%81-iptables-nat-n%C3%BCmun%C9%99l%C9%99ri-sessiya-05-%C9%99mrl%C9%99"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f501.svg" data-marp-twemoji=""/> iptables: NAT nümunələri (Sessiya 05 əmrlə)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># SNAT/masquerade: 192.168.0.0/24 internetə eth0-dan çıxsın</span>
$ <span class="hljs-built_in">sudo</span> iptables -t nat -A POSTROUTING -s 192.168.0.0/24 -o eth0 -j MASQUERADE
$ <span class="hljs-built_in">sudo</span> sysctl -w net.ipv4.ip_forward=1       <span class="hljs-comment"># kernel paketi &quot;ötürə&quot; bilsin</span>

<span class="hljs-comment"># DNAT: xaricdən 8080 -&gt; daxili 192.168.0.21:80</span>
$ <span class="hljs-built_in">sudo</span> iptables -t nat -A PREROUTING -p tcp --dport 8080 \
    -j DNAT --to-destination 192.168.0.21:80
$ <span class="hljs-built_in">sudo</span> iptables -A FORWARD -d 192.168.0.21 -p tcp --dport 80 -j ACCEPT
</code></pre>
<table>
<thead>
<tr>
<th>Əmr</th>
<th>Hansı zəncir</th>
<th>Sessiya 05</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>MASQUERADE</code></td>
<td><code>POSTROUTING</code> (<strong>çıxışda</strong>)</td>
<td>SNAT</td>
</tr>
<tr>
<td><code>DNAT</code></td>
<td><code>PREROUTING</code> (<strong>girişdə</strong>)</td>
<td>port forwarding</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>ip_forward=1</code> olmasa, Linux <strong>router kimi</strong> paketi ötürmür. NAT qaydası yazsan da işləməz.</p>
</blockquote>
</section>

<h2 id="%F0%9F%92%BE-qaydalar-reboot-da-itir"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4be.svg" data-marp-twemoji=""/> Qaydalar reboot-da itir!</h2>
<p><code>iptables</code> qaydaları <strong>yalnız yaddaşdadır</strong>. Server yenidən başlayanda <strong>hamısı silinir</strong>.</p>
<table>
<thead>
<tr>
<th>Əmr</th>
<th>Nə edir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>sudo iptables-save &gt; /root/fw.bak</code></td>
<td>hazırkı qaydaları <strong>fayla yaz</strong> (ehtiyat)</td>
</tr>
<tr>
<td><code>sudo iptables-restore &lt; /root/fw.bak</code></td>
<td>fayldan <strong>geri yüklə</strong></td>
</tr>
<tr>
<td><code>sudo apt install iptables-persistent</code></td>
<td>Debian/Ubuntu: açılışda avtomatik yükləmə</td>
</tr>
<tr>
<td><code>sudo netfilter-persistent save</code></td>
<td>qaydaları <code>/etc/iptables/rules.v4</code>-ə <strong>daimi</strong> yaz</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>ufw enable</code> etdikdə qaydalar <strong>özü daimi</strong> olur. <code>iptables</code>-da isə <code>save</code> etməsən, test qaydaların <strong>bir reboot-da yoxa çıxır</strong>. Bəzən bu <strong>yaxşıdır</strong> (səhv qayda reboot ilə sönür), amma <strong>sərt</strong> qaydaya güvənmə.</p>
</blockquote>

<h2 id="%F0%9F%86%95-nftables-yeni-n%C9%99sil"><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f195.svg" data-marp-twemoji=""/> nftables: yeni nəsil</h2>
<p><code>nftables</code> = <code>iptables</code>-ın <strong>varisi</strong>. Eyni kernel <code>netfilter</code>, <strong>yeni pult</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> nft list ruleset                    <span class="hljs-comment"># bütün qaydalara bax</span>
table inet filter {
  chain input {
    <span class="hljs-built_in">type</span> filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr 192.168.0.0/24 tcp dport 22 accept
    tcp dport { 80, 443 } accept
  }
}
</code></pre>
<ul>
<li><code>table inet filter</code> = <strong>IPv4 və IPv6</strong> bir cədvəldə</li>
<li><code>hook input</code> = <code>INPUT</code> zənciri, <code>policy drop</code> = default DROP</li>
<li><code>{ 80, 443 }</code> = <strong>set</strong>: bir sətirdə bir neçə port</li>
</ul>
</section>

<table>
<thead>
<tr>
<th>Mövzu</th>
<th><code>iptables</code></th>
<th><code>nftables</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Əmr</td>
<td><code>iptables</code>, <code>ip6tables</code> (ayrı)</td>
<td><strong><code>nft</code></strong> (hamısı bir)</td>
</tr>
<tr>
<td>IPv4/IPv6</td>
<td>ayrı qaydalar</td>
<td><code>inet</code> ilə <strong>birlikdə</strong></td>
</tr>
<tr>
<td>Çox port</td>
<td>hər port ayrı qayda</td>
<td><code>{ 80, 443 }</code> <strong>set</strong></td>
</tr>
<tr>
<td>Qaydaları yükləmə</td>
<td><strong>bir-bir</strong></td>
<td>fayl, <strong>atomik</strong></td>
</tr>
<tr>
<td>Vəziyyət</td>
<td>köhnə, hələ geniş</td>
<td><strong>yeni</strong>, tövsiyə olunan</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ iptables-translate -A INPUT -p tcp --dport 22 -j ACCEPT

</code></pre>
<blockquote>
<p>Yeni server üçün <code>ufw</code> və ya <code>nftables</code>. <strong>Köhnə</strong> mühitdə <code>iptables</code>-ı oxuya bilməlisən. <code>iptables-translate</code> köhnə qaydanı <code>nft</code>-ə <strong>çevirir</strong>.</p>
</blockquote>

<h2 id="%F0%9F%98%B1-%C3%B6z%C3%BCn%C3%BC-kilidl%C9%99m%C9%99k-ssenari"><img class="emoji" draggable="false" alt="😱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f631.svg" data-marp-twemoji=""/> Özünü kilidləmək: ssenari</h2>
<p>SSH ilə uzaq serverdəsən və firewall-u sərtləşdirirsən:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  1. Sən SSH ilə 192.168.0.21-ə qoşulmusan
  2. sudo iptables -P INPUT DROP          &lt;- ESTABLISHED qaydası olmadan
  3. Cavab paketləri atılır: terminal DONUR
  4. Yenidən qoşulmaq da mümkün deyil (22 açıq deyil)
  5. Yeganə yol: cloud konsolu / fiziki giriş
</code></pre>
<table>
<thead>
<tr>
<th>Səhv</th>
<th>Niyə baş verir</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ESTABLISHED</code> qaydası yoxdur</td>
<td>cavablar atılır</td>
</tr>
<tr>
<td><code>allow 22</code> yoxdur</td>
<td>yeni giriş yoxdur</td>
</tr>
<tr>
<td><code>-P DROP</code> əvvəl yazıldı</td>
<td>qayda əlavə etməyə vaxt qalmır</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Qayda №1:</strong> uzaq maşında firewall dəyişəndə <strong>ikinci SSH sessiyasını açıq saxla</strong> və <strong>avtomatik geri qaytarma</strong> qur (növbəti slayd).</p>
</blockquote>

<h2 id="%F0%9F%9B%9F-t%C9%99hl%C3%BCk%C9%99siz-t%C9%99tbiq-avtomatik-geri-qaytarma"><img class="emoji" draggable="false" alt="🛟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6df.svg" data-marp-twemoji=""/> Təhlükəsiz tətbiq: avtomatik geri qaytarma</h2>
<p><strong>Plan:</strong> qaydanı yaz, <strong>5 dəqiqə sonra</strong> köhnə qaydaları <strong>özü qaytaran</strong> vaxtölçən qur. SSH işləsə, vaxtölçəni <strong>ləğv et</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1) Ehtiyat al</span>
$ <span class="hljs-built_in">sudo</span> iptables-save | <span class="hljs-built_in">sudo</span> <span class="hljs-built_in">tee</span> /root/fw.bak &gt; /dev/null
<span class="hljs-comment"># 2) 5 dəqiqə sonra geri qaytar (at ilə)</span>
$ <span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;iptables-restore &lt; /root/fw.bak&quot;</span> | <span class="hljs-built_in">sudo</span> at now + 5 minutes
<span class="hljs-comment"># 3) İndi qaydanı dəyiş ... yeni SSH sessiyası ilə yoxla</span>
<span class="hljs-comment"># 4) İşləyirsə: planlanmış geri qaytarmanı ləğv et</span>
$ <span class="hljs-built_in">sudo</span> atq            <span class="hljs-comment"># siyahı (iş nömrəsi)</span>
$ <span class="hljs-built_in">sudo</span> atrm 1         <span class="hljs-comment"># nömrə 1-i ləğv et</span>
</code></pre>
<blockquote>
<p><code>at</code> yoxdursa: <code>sudo apt install at</code>. Alternativ: <code>(sleep 300; iptables-restore &lt; /root/fw.bak) &amp;</code> (ləğv: <code>kill</code>). Kilidlənsən, <strong>5 dəqiqə gözlə</strong>, firewall özü qayıdır.</p>
</blockquote>

<h2 id="%F0%9F%90%B3-docker-v%C9%99-firewall-toqqu%C5%9Fmas%C4%B1"><img class="emoji" draggable="false" alt="🐳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f433.svg" data-marp-twemoji=""/> Docker və firewall toqquşması</h2>
<p><strong>Problem.</strong> <code>ufw deny 5432</code>, amma <code>docker run -p 5432:5432 ...</code> portu <strong>xaricə açır</strong>. Niyə?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Docker -p  ──► nat PREROUTING (DNAT) ──► FORWARD ──► konteyner 172.17.0.2
  ufw qaydaları ──────────► INPUT zənciri (bu yola BAXMIR)
</code></pre>
<ul>
<li>Docker <strong>öz iptables qaydalarını</strong> (<code>DOCKER</code> zənciri) yazır</li>
<li>Trafik <code>INPUT</code>-dan <strong>keçmir</strong>, <code>FORWARD</code>-dan keçir, <code>ufw</code>-nun <code>INPUT</code> qaydası görmür</li>
<li><strong>Həll:</strong> portu yalnız lokala bağla: <code>docker run -p 127.0.0.1:5432:5432 ...</code></li>
</ul>
<blockquote>
<p><code>ss -tlnp</code> ilə yoxla: <code>127.0.0.1:5432</code> = yalnız <strong>lokal</strong>, <code>0.0.0.0:5432</code> = <strong>hamıya açıq</strong>.</p>
</blockquote>

<h2 id="%F0%9F%AA%9C-problem-h%C9%99lli-n%C9%99rdivan%C4%B1-port-a%C3%A7%C4%B1qd%C4%B1r-amma-%C3%A7atm%C4%B1r"><img class="emoji" draggable="false" alt="🪜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fa9c.svg" data-marp-twemoji=""/> Problem həlli nərdivanı: port açıqdır, amma çatmır</h2>
<p>Client-də <code>timeout</code> və ya <code>refused</code>. <strong>Yuxarıdan aşağı</strong> yoxla (Sessiya 04):</p>
<table>
<thead>
<tr>
<th>Addım</th>
<th>Əmr (serverdə)</th>
<th>Nəyi göstərir</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Servis <strong>dinləyir</strong>?</td>
<td><code>ss -tln</code></td>
<td><code>LISTEN</code> və <strong>hansı ünvanda</strong> (<code>0.0.0.0</code> / <code>127.0.0.1</code>)</td>
</tr>
<tr>
<td>2. Host firewall?</td>
<td><code>sudo ufw status</code> və ya <code>sudo iptables -L -n -v</code></td>
<td><code>DROP</code>/<code>REJECT</code> qaydası, <code>pkts</code> artır?</td>
</tr>
<tr>
<td>3. Cloud firewall?</td>
<td><strong>Security Group</strong>, NACL</td>
<td>Sessiya 05: AWS qatı</td>
</tr>
<tr>
<td>4. Başqa qat?</td>
<td>Docker, NetworkPolicy</td>
<td><code>-p</code> və Kubernetes</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>refused</code> = adətən <strong>servis dinləmir</strong> və ya <strong>REJECT</strong> (addım 1-2). <code>timeout</code> = adətən <strong>DROP</strong> (addım 2-3). <strong>Hər addımı</strong> ardıcıl yoxla, atlama.</p>
</blockquote>
</section>

<h2 id="%E2%9A%A0%EF%B8%8F-tipik-s%C9%99hvl%C9%99r"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Tipik səhvlər</h2>
<table>
<thead>
<tr>
<th>Səhv</th>
<th>Nəticə</th>
<th>Düzgün</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ufw enable</code> SSH icazəsiz</td>
<td>SSH kəsilir</td>
<td>əvvəl <code>ufw allow 22/tcp</code></td>
</tr>
<tr>
<td><code>-P INPUT DROP</code> əvvəl</td>
<td>SSH donur</td>
<td>policy <strong>sonda</strong>, <code>ESTABLISHED</code> ilə</td>
</tr>
<tr>
<td><code>iptables -F</code> policy <code>DROP</code> ikən</td>
<td>hər şey bağlanır</td>
<td>əvvəl <code>-P INPUT ACCEPT</code></td>
</tr>
<tr>
<td><code>DROP</code> <code>ACCEPT</code>-dən yuxarıda</td>
<td>icazə <strong>işləmir</strong></td>
<td>dar qayda <strong>yuxarıda</strong></td>
</tr>
<tr>
<td><code>iptables</code> + <code>ufw</code> qarışıq</td>
<td>qaydalar toqquşur</td>
<td><strong>bir</strong> alət seç</td>
</tr>
<tr>
<td><code>save</code> etməmək</td>
<td>reboot-da qayda itir</td>
<td><code>netfilter-persistent save</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Hər dəfə dəyişiklikdən <strong>sonra</strong> yenidən <strong>yeni SSH sessiyası</strong> aç və yoxla. Köhnə sessiya <code>ESTABLISHED</code> qaydasına görə <strong>işləyə bilər</strong>, yeni giriş isə <strong>bağlıdır</strong>.</p>
</blockquote>

<h2 id="%F0%9F%A7%AA-lab-9a--ufw-il%C9%99-t%C9%99hl%C3%BCk%C9%99siz-ba%C5%9Flan%C4%9F%C4%B1c"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 9a — ufw ilə təhlükəsiz başlanğıc</h2>
<p><strong>Test VM-də</strong> işlə (SSH ilə girməmisənsə, ən təhlükəsizi). Servis üçün: <code>python3 -m http.server 8080 &amp;</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> ufw status                      <span class="hljs-comment"># 1) Status: inactive gözlənilir</span>
$ <span class="hljs-built_in">sudo</span> ufw allow 22/tcp                <span class="hljs-comment"># 2) SSH icazəsi (ƏVVƏL!)</span>
$ <span class="hljs-built_in">sudo</span> ufw <span class="hljs-built_in">enable</span>                      <span class="hljs-comment"># 3) y yaz: &quot;active and enabled&quot;</span>
$ <span class="hljs-built_in">sudo</span> ufw status numbered             <span class="hljs-comment"># 4) 22/tcp ALLOW görünür</span>
$ <span class="hljs-built_in">sudo</span> ufw deny 8080/tcp               <span class="hljs-comment"># 5) client-dən: nc -vz -w 3 192.168.0.21 8080</span>
                                       <span class="hljs-comment">#    -&gt; timed out</span>
$ <span class="hljs-built_in">sudo</span> ufw reject 8080/tcp             <span class="hljs-comment"># 6) yenə nc -&gt; Connection refused</span>
</code></pre>
<blockquote>
<p>5-ci addımda <strong>ilk <code>deny</code> qaydasını</strong> silmədən <code>reject</code> əlavə etsən, ilk qayda qalib gəlir. Əvvəl <code>sudo ufw delete deny 8080/tcp</code> et, sonra yoxla. Lab bitəndə: <code>sudo ufw delete reject 8080/tcp</code>.</p>
</blockquote>

<h2 id="%F0%9F%A7%AA-lab-9b--iptables-drop-reject-say"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 9b — iptables: DROP, REJECT, say</h2>
<p>Servis <code>8080</code>-də işləyir. <strong>Əvvəl ufw-nu söndür</strong>: <code>sudo ufw disable</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> iptables -I INPUT -p tcp --dport 8080 -j DROP
$ curl --connect-timeout 3 192.168.0.21:8080     <span class="hljs-comment"># client-dən -&gt; timed out</span>
$ <span class="hljs-built_in">sudo</span> iptables -L INPUT -n -v                   <span class="hljs-comment"># pkts artdı (qayda işləyir)</span>
$ <span class="hljs-built_in">sudo</span> iptables -D INPUT -p tcp --dport 8080 -j DROP
$ <span class="hljs-built_in">sudo</span> iptables -I INPUT -p tcp --dport 8080 -j REJECT --reject-with tcp-reset
$ curl --connect-timeout 3 192.168.0.21:8080     <span class="hljs-comment"># -&gt; Connection refused</span>
$ <span class="hljs-built_in">sudo</span> iptables -D INPUT -p tcp --dport 8080 -j REJECT --reject-with tcp-reset
</code></pre>
<table>
<thead>
<tr>
<th>Addım</th>
<th>Gözlənilən nəticə</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DROP</code> + <code>curl</code></td>
<td>3 san. gözləyib <strong>timeout</strong></td>
</tr>
<tr>
<td><code>-L -n -v</code></td>
<td><code>pkts</code> sütunu <strong>0-dan böyük</strong></td>
</tr>
<tr>
<td><code>REJECT</code> + <code>curl</code></td>
<td><strong>dərhal</strong> <code>refused</code></td>
</tr>
</tbody>

<h2 id="%F0%9F%A7%AA-lab-9c--ehtiyat-al-v%C9%99-geri-qaytar"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 9c — ehtiyat al və geri qaytar</h2>
<p><strong>Təhlükəsiz:</strong> ancaq <strong>test VM-də</strong>, SSH deyil, konsoldan işlə. Məqsəd: <code>save</code> və <code>restore</code> əmrini görmək.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ <span class="hljs-built_in">sudo</span> iptables-save | <span class="hljs-built_in">sudo</span> <span class="hljs-built_in">tee</span> /root/fw.bak &gt; /dev/null   <span class="hljs-comment"># 1) ehtiyat</span>
$ <span class="hljs-built_in">sudo</span> iptables -A INPUT -p tcp --dport 8080 -j DROP       <span class="hljs-comment"># 2) test qaydası</span>
$ <span class="hljs-built_in">sudo</span> iptables -L INPUT -n --line-numbers                 <span class="hljs-comment"># 3) 1 qayda görünür</span>
$ <span class="hljs-built_in">sudo</span> iptables-restore &lt; /root/fw.bak                     <span class="hljs-comment"># 4) geri qaytar</span>
$ <span class="hljs-built_in">sudo</span> iptables -L INPUT -n --line-numbers                 <span class="hljs-comment"># 5) qayda yoxdur</span>
</code></pre>
<table>
<thead>
<tr>
<th>Addım</th>
<th>Gözlənilən nəticə</th>
</tr>
</thead>
<tbody>
<tr>
<td>3</td>
<td><code>dpt:8080</code> qaydası siyahıda</td>
</tr>
<tr>
<td>5</td>
<td>qayda <strong>yoxa çıxıb</strong>, ehtiyat işlədi</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Bu, &quot;özünü kilidləmə&quot;dən <strong>qorunma</strong> təcrübəsidir. İstəsən 2-ci addımın əvəzinə <code>at now + 1 minutes</code> ilə <strong>avtomatik</strong> versiyanı sına.</p>
</blockquote>

<h2 id="%F0%9F%A7%AA-lab-9d--docker--p-v%C9%99-ufw-ist%C9%99y%C9%99-g%C3%B6r%C9%99"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Lab 9d — Docker <code>-p</code> və ufw (istəyə görə)</h2>
<p>Docker qurulubsa. <code>ufw</code> aktivdir və <code>deny 5432</code> var.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ docker run -d --name pg1 -p 5432:5432 -e POSTGRES_PASSWORD=x postgres
$ ss -tlnp | grep 5432                     <span class="hljs-comment"># 0.0.0.0:5432 = hamıya açıq</span>
$ nc -vz 192.168.0.21 5432                 <span class="hljs-comment"># client-dən -&gt; uğurlu (ufw yan keçildi!)</span>
$ docker <span class="hljs-built_in">rm</span> -f pg1
$ docker run -d --name pg2 -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=x postgres
$ ss -tlnp | grep 5432                     <span class="hljs-comment"># 127.0.0.1:5432 = yalnız lokal</span>
$ nc -vz 192.168.0.21 5432                 <span class="hljs-comment"># client-dən -&gt; artıq çatmır</span>
$ docker <span class="hljs-built_in">rm</span> -f pg2
</code></pre>
<blockquote>
<p>Gözlənilən: <code>pg1</code> ilə kənardan <strong>çatır</strong>, <code>pg2</code> ilə <strong>çatmır</strong>. Nəticə nümunədir, Docker versiyasından asılı ola bilər.</p>
</blockquote>

<table>
<thead>
<tr>
<th>Mövzu</th>
<th>Yadda saxla</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>netfilter</strong></td>
<td>kernelin firewall-u, <code>ufw</code>/<code>iptables</code>/<code>nft</code> onun pultlarıdır</td>
</tr>
<tr>
<td><strong>ufw</strong></td>
<td><code>default deny incoming</code>, <code>allow</code>, <code>deny</code> (timeout), <code>reject</code> (refused)</td>
</tr>
<tr>
<td><strong>Sıra</strong></td>
<td>yuxarıdan aşağı, ilk uyğun gələn qalib. <code>-I</code> başa, <code>-A</code> sona</td>
</tr>
<tr>
<td><strong>Zəncirlər</strong></td>
<td><code>INPUT</code> (mənə), <code>OUTPUT</code> (məndən), <code>FORWARD</code> (keçən)</td>
</tr>
<tr>
<td><strong>ESTABLISHED,RELATED</strong></td>
<td>olmadan mövcud SSH <strong>donur</strong></td>
</tr>
<tr>
<td><strong>Policy DROP</strong></td>
<td>həmişə <strong>ən sonda</strong>, <code>-F</code> onu sıfırlamır</td>
</tr>
<tr>
<td><strong>Reboot</strong></td>
<td><code>iptables-save</code>, <code>netfilter-persistent save</code></td>
</tr>
<tr>
<td><strong>Docker</strong></td>
<td><code>-p</code> ufw-nu yan keçir: <code>127.0.0.1:port</code></td>
</tr>
<tr>
<td><strong>Problem həlli</strong></td>
<td><code>ss -tln</code> → host firewall → Security Group</td>
</tr>
</tbody>
</table>
<p><strong>Növbəti dərs:</strong> Sessiya 10 — <strong><code>tcpdump</code></strong>: paketləri canlı görmək.</p>
</section>

<li><strong>ufw:</strong> SSH yalnız <code>192.168.0.0/24</code>-dən, HTTPS hamıdan, qalan gələn trafik bağlı olan qaydaları yaz.</li>
<li><strong>Sıra:</strong> <code>DROP hamı-&gt;22</code> ilə <code>ACCEPT 192.168.0.15-&gt;22</code> qaydalarının hansı sıra ilə <strong>işləmədiyini</strong> izah et. Düzəlt.</li>
<li><strong>ESTABLISHED:</strong> Bu qayda olmadan <code>-P INPUT DROP</code> nə ilə nəticələnir? <strong>Niyə</strong>?</li>
<li><strong>Lab 9b:</strong> <code>DROP</code> və <code>REJECT</code> qaydaları ilə <code>timeout</code> və <code>refused</code> yarat. <code>pkts</code> sütunu nə göstərir?</li>
<li><strong>Təhlükəsizlik:</strong> SSH ilə firewall dəyişərkən <strong>hansı 2 tədbiri</strong> görərsən?</li>
<li><strong>Docker:</strong> <code>ufw deny 5432</code> olduğu halda <code>-p 5432:5432</code> niyə <strong>açıq qalır</strong>?</li>
<li><strong>Problem həlli:</strong> Port açıqdır, <code>nc</code> <code>timeout</code> verir. <strong>Dörd yoxlama addımını</strong> sıra ilə yaz.</li>
</ol>
